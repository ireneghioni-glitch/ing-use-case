<script type="application/ld+json">{"mainEntity":[{"name":"Qu'est-ce qu'un compte d'épargne ?","acceptedAnswer":{"text":"<p>Un compte d'épargne est un compte de dépôt qui vous permet de conserver votre argent en toute sécurité et de percevoir des intérêts. Vous pouvez retirer les fonds quand vous en avez besoin.</p>","@type":"Answer"},"@type":"Question"},{"name":"Quand mon enfant recevra-t-il des intérêts sur son compte d'épargne ?","acceptedAnswer":{"text":"<p>Le&nbsp;<strong>taux d'intérêt de base</strong>&nbsp;est appliqué à partir du jour suivant le dépôt de l'argent sur le compte d'épargne réglementé jusqu'au jour du retrait. Il est versé sur votre compte d'épargne sur une base annuelle, le 1er janvier.</p><p>La <strong>prime de fidélité</strong> n'est acquise que sur les montants qui sont restés de manière ininterrompue sur le compte d'épargne réglementé pendant 12 mois à partir du jour suivant le versement. Elle est versée sur le compte chaque trimestre (janvier, avril, juillet, octobre).</p>","@type":"Answer"},"@type":"Question"},{"name":"Comment et pourquoi épargner pour mon enfant ?","acceptedAnswer":{"text":"<p>Vous souhaitez obtenir davantage de conseils et d'astuces sur la manière de commencer ? Nous nous ferons un plaisir de vous aider. N'hésitez pas à en savoir plus sur&nbsp;<a href=\"epargner-pour-ses-enfants\">pourquoi et comment épargner pour ses enfants</a>.</p>","@type":"Answer"},"@type":"Question"},{"name":"Combien de personnes peuvent être liées à un compte d’épargne pour jeunes ?","acceptedAnswer":{"text":"<p>Seuls les représentants légaux du mineur peuvent servir d’intermédiaires sur le compte d’épargne pour jeunes.</p>","@type":"Answer"},"@type":"Question"},{"name":"Comment ouvrir un compte d’épargne pour jeunes/bébés via l’app ING Banking ?","acceptedAnswer":{"text":"<ol><li>Appuyez sur \"Épargne et comptes à terme\" sous l'onglet \"Produits\"</li><li>Sélectionnez l’option \"Le compte d’épargne pour mineurs\"</li><li>Appuyez sur \"Ouvrir ce compte\" en bas de la page</li></ol>","@type":"Answer"},"@type":"Question"},{"name":"Mon enfant peut-il retirer de l'argent sans mon consentement ?","acceptedAnswer":{"text":"<p>Pas de manière standard. Lors de l'ouverture du compte d'épargne pour votre enfant, vous avez la possibilité d'indiquer cette option (Sterkmaking / Porte-Fort) pour qu'un enfant de plus de 10&nbsp;ans soit autorisé à le faire.&nbsp;<a href=\"https://www.ing.be/fr/particuliers/epargner/porte-fort-sur-compte-depargne\"><span><span><span><span lang=\"FR-BE\" dir=\"ltr\"><span><span>En savoir plus sur le porte-fort ici</span></span></span><span lang=\"FR-BE\" dir=\"ltr\"><span><span>.</span></span></span></span></span></span></a></p>","@type":"Answer"},"@type":"Question"},{"name":"Où pouvez-vous transférer de l’argent depuis un ING Compte d’épargne au nom d’un mineur ?","acceptedAnswer":{"text":"<p><span><span><span><span lang=\"FR-BE\" dir=\"ltr\"><span>Vous pouvez transférer de l’argent de l’ING Compte d’épargne de votre enfant vers&nbsp;:</span></span></span></span></span></p><ul><li><span><span><span><span lang=\"FR-BE\" dir=\"ltr\"><span>Un compte à vue chez ING au nom de votre enfant</span></span></span></span></span></li><li><span><span><span><span lang=\"FR-BE\" dir=\"ltr\"><span>Un compte d’épargne réglementé chez ING au nom de votre enfant ou à votre nom en tant que représentant légal</span></span></span></span></span></li><li><span><span><span><span lang=\"FR-BE\" dir=\"ltr\"><span>Un compte auprès d’une autre banque belge au nom de votre enfant, désigné comme <span>compte de référence externe</span> </span></span></span></span></span><br /><span><span><span><span lang=\"FR-BE\" dir=\"ltr\"><span>(ce n’est possible que si votre enfant n’a pas de compte à vue chez ING)</span></span></span></span></span></li><li><span><span><span><span lang=\"FR-BE\" dir=\"ltr\"><span>Vous pouvez également effectuer un retrait d’argent au guichet d’une agence ING</span></span></span></span></span></li></ul><p><span><span><span><span lang=\"FR-BE\" dir=\"ltr\"><span>Attention&nbsp;: l’argent sur le compte d’un mineur doit être géré par le représentant légal comme une <strong>personne prudente et raisonnable.</strong></span></span></span></span></span></p>","@type":"Answer"},"@type":"Question"}],"@context":"https://schema.org","@type":"FAQPage"}</script>
