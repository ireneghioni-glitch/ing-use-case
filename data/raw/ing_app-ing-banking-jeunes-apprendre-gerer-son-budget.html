<script type="application/ld+json">{"mainEntity":[{"name":"Qui peut utiliser l'app ING Banking ?","acceptedAnswer":{"text":"<p>Tout client ING âgé de 10 ans et plus, titulaire d'un&nbsp;<strong>compte privé</strong>, peut télécharger et utiliser l'app ING Banking. L'application ING Banking peut être installée sur les smartphones équipés d'un système d'exploitation iOS et Android. Les clients d'ING disposant d'une&nbsp;<strong>tablette&nbsp;</strong>peuvent également télécharger l'application ING Banking.</p>","@type":"Answer"},"@type":"Question"},{"name":"Que faire en cas de perte ou de vol de mon smartphone ?","acceptedAnswer":{"text":"<p>L'app ING Banking est sécurisée par votre code à 5 chiffres, votre empreinte digitale ou votre FaceID, de sorte que vos opérations bancaires ne soient pas accessibles à des tiers via l'application sur votre smartphone ou tablette. Si votre appareil est perdu ou volé, vous pouvez&nbsp;<a href=\"bloquer-mon-telephone\"><strong>supprimer vous-même votre profil via Home'Bank</strong></a>. Pour ce faire, sélectionnez l'appareil que vous avez perdu, puis cliquez sur \"Actions\", et enfin sélectionnez \"Supprimer le profil\".&nbsp;<strong>Vous pouvez également nous appeler au</strong>&nbsp;+32 2 464 60 02 . Nous sommes à votre disposition du lundi au vendredi de 8h à 22h et le samedi de 9h à 17h. Vous avez un nouveau téléphone ? Téléchargez l'app ING Banking via votre app store et créez un nouveau profil dans l'application.</p>","@type":"Answer"},"@type":"Question"},{"name":"L'app ING Banking est-elle sûre ?","acceptedAnswer":{"text":"<p>Bien sûr ! ING Banking est protégée par la même technologie sécurisée qu'ING utilise pour ses autres services bancaires en ligne (Home'bank et Business'Bank). Votre profil est créé par vous à l'aide de votre carte de débit ING et de votre lecteur de carte. En outre, les coordonnées bancaires ne sont jamais stockées sur votre appareil. Vous avez également toujours besoin de votre code personnel à 5 chiffres, de vos empreintes digitales ou de votre FaceID pour vous connecter à l'application ING Banking et signer des transactions. Vous voulez en savoir plus sur la sécurité des services bancaires en ligne ? Pour en savoir plus,&nbsp;<a href=\"index\"><strong>consultez notre section consacrée à la sécurité en ligne</strong></a>.</p>","@type":"Answer"},"@type":"Question"},{"name":"Je n'ai pas de lecteur de carte : comment installer l'app ?","acceptedAnswer":{"text":"<p>Vous aurez besoin de votre carte de débit ING et de l'app&nbsp;itsme® ou de votre lecteur de carte ING pour vous créer un profil et commencer à utiliser l'app. Si vous n'avez pas accès à itsme® ou si vous n'avez pas de lecteur de carte ING, vous pouvez&nbsp;<a href=\"https://www.ing.be/fr/retail/apply-for-card-reader?\">commander un lecteur de carte ING</a>&nbsp;en ligne maintenant et celui-ci vous sera livré dans les 3 jours ouvrables. Le lecteur de carte ING est gratuit pour les mineurs.</p>","@type":"Answer"},"@type":"Question"},{"name":"J'ai déjà Home'Bank. Pourqoui utiliser l'app ING Banking ?","acceptedAnswer":{"text":"<p><strong>Home'Bank</strong>&nbsp;est accessible uniquement via notre site ing.be et est utile pour :</p><ul><li>Les virements&nbsp;<strong>en devises</strong>, hors de la zone SEPA&nbsp;</li><li>Les transactions&nbsp;<strong>au-delà de 5.000 euros/jour</strong></li><li><strong>Certaines opérations plus exceptionnelles (impression d’extraits de compte</strong>, ajout d’un&nbsp;<strong>mandataire&nbsp;</strong>par exemple).&nbsp;</li></ul><p>L’<strong>app ING Banking</strong>&nbsp;peut s’installer sur smartphone ou tablette. Accessible en quelques secondes, elle est votre meilleure alliée pour :&nbsp;</p><ul><li><strong>Gérer vos comptes au quotidien</strong>&nbsp;: effectuer des virements en euros, consulter rapidement votre solde, vos investissements ou les dépenses de votre carte de crédit.</li><li><strong>Garder une vue sur votre budget&nbsp;</strong>: recevoir des alertes lorsque votre solde passe en-dessous d’un certain montant ou que votre salaire est arrivé, envoyer des rappels à vos amis distraits pour qu’ils vous remboursent via&nbsp;<a href=\"wero\"><strong>Wero</strong></a>.&nbsp;</li><li><strong>Faire des économies&nbsp;</strong>: bénéficiez de réductions exclusives grâce aux<a href=\"ing-plus-deals\">&nbsp;<strong>ING+ deals</strong></a></li><li><strong>Accéder à une multitude de services</strong>&nbsp;: activer maestro pour l’étranger, relever la limite de votre carte de crédit ou de débit…&nbsp;</li></ul><p>….et bien plus encore !&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Encore des questions ?","acceptedAnswer":{"text":"<p>Nous vous aidons volontiers au +32 2 464 60 02 du lundi au vendredi de 8h à 18h. Vous pouvez également nous envoyer vos questions via le chat accessible dans l'app ou&nbsp;<a href=\"https://www.ing.be/fr/particuliers/services/contactez-nous\">via notre site web</a>.</p>","@type":"Answer"},"@type":"Question"}],"@context":"https://schema.org","@type":"FAQPage"}</script>
