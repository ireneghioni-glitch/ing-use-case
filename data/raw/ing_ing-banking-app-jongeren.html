<script type="application/ld+json">{"mainEntity":[{"name":"Wie kan de ING Banking-app gebruiken?","acceptedAnswer":{"text":"<p>Elke ING-klant vanaf 10 jaar, met een zichtrekening, kan de ING Banking-app downloaden en gebruiken. De ING Banking-app kan worden geïnstalleerd op&nbsp;<strong>smartphones&nbsp;</strong>met een iOS- en Android-besturingssysteem. ING-klanten met een&nbsp;<strong>tablet&nbsp;</strong>kunnen de ING Banking-app ook downloaden.</p>","@type":"Answer"},"@type":"Question"},{"name":"Smartphone kwijt of gestolen? Wat nu?","acceptedAnswer":{"text":"<p>De ING Banking-app is beveiligd met jouw&nbsp;<strong>5-cijferige code, vingerafdruk of gezichtsherkenning</strong>, je bankzaken zijn dus niet toegankelijk voor derden via de app op jouw smartphone of tablet.&nbsp;</p><p>Bij verlies of diefstal van je toestel kun je jouw profiel&nbsp;<strong>zelf verwijderen via Home’Bank</strong>&nbsp;of ons bellen op het nummer dat vermeld staat op de achterkant van je ING-debetkaart:&nbsp;<strong>+32 2 464 60 01</strong>. Selecteer in Home’Bank het toestel dat je verloren bent, klik daarna op “<strong>Acties</strong>”, en kies vervolgens “<strong>Verwijder profiel</strong>”.</p><p>Heb je een nieuw toestel? Dan download je de ING Banking-app via je app store en maak je opnieuw een profiel aan in de app.</p>","@type":"Answer"},"@type":"Question"},{"name":"Is de ING Banking-app veilig?","acceptedAnswer":{"text":"<p>Natuurlijk! ING Banking is beschermd door dezelfde, veilige technologie die ING ook gebruikt voor onze andere diensten voor online bankieren (Home’bank en Business’Bank). Jouw profiel wordt door jou aangemaakt met je ING-debetkaart en -kaartlezer. Daarnaast worden bankgegevens nooit op je toestel bewaard. Je hebt ook steeds je persoonlijke 5-cijferige code, vingerafdruk of Face ID nodig om je aan te melden in de ING Banking-app en om verrichtingen te ondertekenen.</p>","@type":"Answer"},"@type":"Question"},{"name":"Ik heb geen kaartlezer. Hoe installeer ik de app?","acceptedAnswer":{"text":"<p>Je hebt je ING-debetkaart en de&nbsp;itsme®-app (als je 16 jaar of ouder bent) of een ING Card Reader nodig om je profiel aan te maken en de app te gebruiken. Heb je geen toegang tot&nbsp;itsme® en heb je geen&nbsp;ING Card Reader?&nbsp;<a href=\"vraag-toestel\">Bestel een ING Card Reader online</a>&nbsp;en binnen 3 werkdagen wordt deze bij jou thuis bezorgd. De ING Card Reader is gratis voor minderjarigen.</p>","@type":"Answer"},"@type":"Question"},{"name":"Wat is het verschil tussen Home'Bank en ING Banking?","acceptedAnswer":{"text":"<p>Home'Bank is enkel toegankelijk via onze website ing.be en is handig:</p><ul><li>voor overschrijvingen in&nbsp;<strong>vreemde valuta</strong>, buiten de SEPA-zone&nbsp;</li><li>bij transacties voor meer dan&nbsp;<strong>5.000 euro/dag</strong></li><li><strong>voor bepaalde uitzonderlijke verrichtingen (bijvoorbeeld het afdrukken van&nbsp;rekeningafschriften&nbsp;</strong>of toevoegen van een&nbsp;<strong>mandataris</strong>).&nbsp;</li></ul><p>De&nbsp;<strong>ING Banking-app</strong>&nbsp;kun je installeren op een smartphone of tablet. De app, die je in enkele seconden opent, is je beste bondgenoot, elk dag opnieuw!&nbsp;</p><ul><li><strong>Beheer met de app je rekeningen:</strong>&nbsp;voer overschrijvingen in euro uit of raadpleeg snel je rekeningsaldo, je beleggingen of de uitgaven met je kredietkaart.</li><li><strong>Houd je budget in de gaten:</strong>&nbsp;ontvang meldingen wanneer je saldo onder een bepaald bedrag zakt of wanneer je salaris is gestort, stuur herinneringen naar verstrooide vrienden zodat ze je via&nbsp;<a href=\"wero\"><strong>Wero</strong></a><strong>&nbsp;</strong>kunnen terugbetalen.&nbsp;</li><li><strong>Bespaar geld:</strong>&nbsp;geniet van exclusieve kortingen dankzij de&nbsp;<a href=\"ing-plus-deals\"><strong>ING+ deals</strong></a></li><li><strong>Krijg toegang tot een groot aantal diensten</strong>: activeer maestro voor het buitenland, verhoog de limiet van je krediet- of debetkaart, enz.&nbsp;</li></ul><p>... en nog veel meer&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Ik heb nog enkele vragen, met wie kan ik contact opnemen?","acceptedAnswer":{"text":"<p>We helpen je graag verder op +32 2 464 60 01 van maandag tot vrijdag van 8u tot 18u. Ontdek de mogelijkheden om ons te contacteren&nbsp;via&nbsp;<a href=\"https://www.ing.be/nl/particulieren/diensten/neem-contact-op\">onze website</a>.</p>","@type":"Answer"},"@type":"Question"}],"@context":"https://schema.org","@type":"FAQPage"}</script>
