<script type="application/ld+json">{"mainEntity":[{"name":"Welke kosten kan je mogelijk hoeven te betalen","acceptedAnswer":{"text":"<p>Je betaalt een € 0,83&nbsp;<strong>vaste maandelijkse bijdrage</strong>, behalve als je een ING More hebt.</p><p>Heb je in euro betaald en staat er&nbsp;<strong>voldoende geld op je zichtrekening&nbsp;</strong>op het moment van de maandelijkse afsluiting? Dan betaal je geen extra kosten of rente.&nbsp;</p><p>🚫&nbsp;<strong>Let op:</strong>&nbsp;er worden kosten aangerekend als je geld afhaalt met je kredietkaart aan een geldautomaat. Daarom raden we aan om voor dit soort afhalingen je ING-debetkaart te gebruiken, zowel in België als in het buitenland.&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Is een kredietkaart inbegrepen in het ING More pack","acceptedAnswer":{"text":"<p>Ja, je kan een Visa Classic kredietkaart aanvragen die inbegrepen is in je ING More pack (onder voorbehoud van aanvaarding). Er zijn geen extra kosten zolang je het pack behoudt.</p><p>Ontdek hier alle voordelen van het&nbsp;<a href=\"https://www.ing.be/nl/particulieren/zichtrekeningen-packs/pack-more\">ING More pack</a></p>","@type":"Answer"},"@type":"Question"},{"name":"Is het veilig om met deze kaart online aankopen te doen?","acceptedAnswer":{"text":"<p>Dankzij Verified by Visa&nbsp;<a href=\"online-betalingen\">betaal je veilig</a>&nbsp;met je kredietkaart bij deelnemende webshops. En online aankopen zijn bovendien gratis verzekerd tegen niet-levering en niet-conforme levering, voor een maximumbedrag van 500 euro per jaar.</p>","@type":"Answer"},"@type":"Question"},{"name":"Welke verzekeringen zijn inbegrepen?","acceptedAnswer":{"text":"<p>Als houder van een ING Visa Classic kredietkaart geniet je van 3 gratis verzekeringen.</p><ul><li><strong>Aankoopverzekering</strong></li><li><strong>Verzekering 'Levering van via internet gekochte goederen'</strong></li><li><strong>Reisongevallenverzekering</strong></li></ul><p>Ontdek&nbsp;<a href=\"kredietkaart-verzekering\">hier</a>&nbsp;het verzekeringsaanbod en hoe je een schadedossier indient bij de verzekeraar.</p><p>Voor alle bijkomende informatie over de onderschreven verzekering, gelieve de&nbsp;<a href=\"https://assets.ing.com/m/424aa84d735cb2a1/original/ReglementINGVisaClassicVisaGoldMCGoldNewNL.pdf\">algemene voorwaarden (pdf)</a>&nbsp;te raadplegen.</p>","@type":"Answer"},"@type":"Question"},{"name":"Hoe activeer ik mijn kredietkaart na ontvangst?","acceptedAnswer":{"text":"<p>In&nbsp;<a href=\"mijn-nieuwe-kaart\">dit artikel</a>&nbsp;vind je de te volgen stappen.</p>","@type":"Answer"},"@type":"Question"},{"name":"Hoe kan ik deze kaart gebruiken in het buitenland?","acceptedAnswer":{"text":"<p>Bij ING kun je jouw kredietkaart automatisch in het buitenland gebruiken, wat niet bij alle banken zo is. Je hoeft dus helemaal niets te doen! Je kredietkaart is niet beperkt tot bepaalde regio's. Je kunt dus in alle landen, in alle vrijheid en veiligheid betalingen en geldopnemingen doen.</p>","@type":"Answer"},"@type":"Question"},{"name":"Kan ik met deze kredietkaart geld opnemen?","acceptedAnswer":{"text":"<p>Natuurlijk. Dat kan <a href=\"vind-een-geldautomaat\">aan alle bankautomaten</a> of bankkaarten die het Visa-logo tonen. Zowel in België als in het buitenland.</p>","@type":"Answer"},"@type":"Question"},{"name":"Hoe betaal ik mijn uitgaven terug?","acceptedAnswer":{"text":"<p>De terugbetaling van je maandelijkse uitgaven met je ING Visa Classic kredietkaart verloopt automatisch. De uitgaveperiode wordt telkens op de 27e van de maand afgesloten. Negen kalenderdagen later gaat het bedrag van de ING-zichtrekening die aan je Visa Classic kredietkaart gekoppeld is. Daar hoef je dus niet aan te denken!</p>","@type":"Answer"},"@type":"Question"},{"name":"Hoe hou ik mijn uitgaven in het oog?","acceptedAnswer":{"text":"<p>Kijk je uitgaven van de lopende en de vorige maand na via onze beveiligde&nbsp;<a href=\"ing-banking-app\">app voor smartphone</a>&nbsp;of&nbsp;<a href=\"pc-banking\">Home'Bank</a>. Zo krijg je een detailoverzicht van je uitgaven en het beschikbare bedrag. Je bent dus altijd perfect op de hoogte van het nog beschikbare saldo voor betalingen met je ING Visa Classic kredietkaart.</p>","@type":"Answer"},"@type":"Question"},{"name":"Een vraag over je kredietkaartuitgaven?","acceptedAnswer":{"text":"<p>Informatie over verrichtingen uitgevoerd met je kredietkaart is beschikbaar op <a href=\"https://mijnkaart.be/nl/home.html\">mijnkaart.be</a>.<br />Je vindt in het bijzonder</p><ul><li>hoe een kopie van een uitgavenstaat opvragen</li><li>hoe een aankoop betwisten via dit formulier: <a href=\"https://mijnkaart.be/nl-be/home/how-can-we-help/forms/purchase-dispute\">Betwisten van een aankoop - Worldline Belgium</a></li><li>hoe een positief saldo dat op jouw&nbsp;kaart is gestort, terugkrijgen</li></ul>","@type":"Answer"},"@type":"Question"},{"name":"Waar kan ik de uitgavenstaten van een kredietkaart vinden?","acceptedAnswer":{"text":"<p>Maandelijkse uitgavenstaten van de ING-kredietkaarten zijn gratis verkrijgbaar</p><ul><li><strong>online, via Zoomit</strong></li><li><strong>of op papier, </strong>per post verzonden</li></ul><p>Als je je&nbsp;<strong>rekeninguittreksels</strong> elektronisch ontvangt, zijn de uitgavenstaten van jouw kredietkaart ook <strong>online</strong> beschikbaar, <strong>via Zoomit</strong>. Registratie in Zoomit is automatisch; je hoeft niets te doen!</p><p>Ontdek<a href=\"online-uitgavenstaten\"> </a>in detail hoe het werkt.</p><p>Als je&nbsp;<strong>de uitgavenstaten van jouw kredietkaart op papier ontvangt</strong>, kan je de leveringsmethode in de ING Banking-app of Home'bank beheren en kiezen voor de elektronische versie.</p>","@type":"Answer"},"@type":"Question"},{"name":"Hoe lang is mijn kredietkaart geldig?","acceptedAnswer":{"text":"<p><span><span><span>De geldigheid van je kredietkaart is 5 jaar. Deze wordt automatisch hernieuwd en je ontvangt 2 maanden vóór de vervaldatum een </span><span>​​</span><span>nieuwe kaart.</span></span></span></p>","@type":"Answer"},"@type":"Question"},{"name":"Kredietkaart verloren of gestolen?","acceptedAnswer":{"text":"<p>Check&nbsp;<a href=\"https://www.ing.be/nl/particulieren/voor-elke-dag/blok-verloren-gestolen-kaart\">hoe je kaart onmiddellijk online te blokkeren</a></p><p>&nbsp;</p>","@type":"Answer"},"@type":"Question"}],"@context":"https://schema.org","@type":"FAQPage"}</script>
