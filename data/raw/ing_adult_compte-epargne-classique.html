<script type="application/ld+json">{"mainEntity":[{"name":"Qu'est-ce qu'un compte d'épargne ?","acceptedAnswer":{"text":"<p>Un compte d'épargne est un compte de dépôt qui vous permet de conserver votre argent en toute sécurité et de percevoir des intérêts. Vous pouvez retirer les fonds quand vous en avez besoin.</p>","@type":"Answer"},"@type":"Question"},{"name":"Puis-je ouvrir un compte d'épargne pour plus d'un titulaire ?","acceptedAnswer":{"text":"<p>Oui, c'est possible ! Pour 2 titulaires ! Vous pouvez désormais ouvrir facilement un compte épargne commun via Home'Bank ou l'application ING Banking. Vous préférez venir en personne ? Il est toujours possible de prendre rendez-vous dans une agence ING pour ouvrir un compte épargne avec un co-titulaire.</p>","@type":"Answer"},"@type":"Question"},{"name":"Quand recevrai-je les intérêts de mon compte d'épargne ?","acceptedAnswer":{"text":"<p>Le&nbsp;<strong>taux d'intérêt de base</strong>&nbsp;est appliqué à partir du jour suivant le dépôt de l'argent sur le compte d'épargne réglementé jusqu'au jour du retrait. Il est versé sur votre compte d'épargne sur une base annuelle, le 1er janvier.</p><p>La <strong>prime de fidélité</strong> n'est acquise que sur les montants qui sont restés de manière ininterrompue sur le compte d'épargne réglementé pendant 12 mois à partir du jour suivant le versement.&nbsp;Elle est versée sur le compte chaque trimestre (janvier, avril, juillet, octobre).</p>","@type":"Answer"},"@type":"Question"},{"name":"Puis-je épargner pour mon bébé, mon filleul ou mon petit-enfant ?","acceptedAnswer":{"text":"<p>Oui, bien sûr.</p><ul><li>Vous pouvez facilement ouvrir un&nbsp;<a href=\"compte-epargne-jeune\">compte d'épargne pour votre enfant</a>&nbsp;à son nom.</li><li>Vous pouvez épargner pour votre filleul ou votre petit-fils par le biais d'un <a href=\"compte-epargne-classique\">compte d'épargne classique</a> à votre nom avec, par exemple, une clause tierce.</li></ul>","@type":"Answer"},"@type":"Question"},{"name":"Ai-je besoin d'un compte à vue ING pour ouvrir un compte d'épargne ING ?","acceptedAnswer":{"text":"<p>Non, il n'est pas obligatoire de disposer d'un compte à vue ING pour ouvrir un compte d'épargne ING. Nous pensons toutefois que notre compte à vue peut également être très intéressant et nous vous invitons à en découvrir ses avantages.</p>","@type":"Answer"},"@type":"Question"},{"name":"Envie de commencer avec ING ?","acceptedAnswer":{"text":"<p>Rejoignez notre famille orange en ouvrant <a href=\"https://www.ing.be/fr/particuliers/gerer-le-quotidien/comparatif-compte-bancaire\">le compte à vue</a> ou le <a href=\"https://www.ing.be/fr/particuliers/epargner/comparatif-compte-epargne\">compte d'épargne</a> qui vous convient le mieux.</p>","@type":"Answer"},"@type":"Question"},{"name":"Comment ajouter un compte de référence externe ?","acceptedAnswer":{"text":"<p><span><span><span><span lang=\"FR-BE\" dir=\"ltr\"><span>Via le <a href=\"http://ebanking.ing.be/banking/accounts/add-external-reference-account\">formulaire en ligne</a> : sélectionnez le compte d’épargne réglementé auquel vous souhaitez lier un compte de référence externe, indiquez votre compte de référence externe détenu dans une autre banque belge et effectuez un virement de minimum 0,01€ de ce compte externe vers votre compte d’épargne reglementé ING. </span></span></span></span></span></p>","@type":"Answer"},"@type":"Question"}],"@context":"https://schema.org","@type":"FAQPage"}</script>
