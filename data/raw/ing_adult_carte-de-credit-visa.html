<script type="application/ld+json">{"mainEntity":[{"name":"Quels frais puis-je être amené-e à payer ?","acceptedAnswer":{"text":"<p>Vous payez une cotisation mensuelle fixe de 2,25 €/mois, sauf si vous êtes titulaire d'un pack ING More.</p><p>Vous avez payé en euros et vous avez suffisamment d’argent sur votre compte courant au moment de la clôture mensuelle ? Aucun frais supplémentaire ni intérêt ne s’applique.&nbsp;</p><p>🚫À savoir : des frais sont facturés si vous retirez de l’argent avec votre carte de crédit à un distributeur automatique. C’est pourquoi nous vous recommandons d’utiliser votre carte de débit ING pour ce type de retrait quand c’est possible, en Belgique comme à l’étranger.&nbsp;&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"La carte de crédit est-elle incluse dans le pack ING More ?","acceptedAnswer":{"text":"<p>Oui, vous pouvez demander une carte de crédit Visa Classic incluse dans votre pack ING More (sous réserve d’acceptation). Aucun frais supplémentaire tant que vous conservez le pack.</p><p>Découvrez tous les avantages du pack ING More&nbsp;<a href=\"https://www.ing.be/fr/particuliers/comptes-bancaire-packs/pack-more\">ici</a></p>","@type":"Answer"},"@type":"Question"},{"name":"Quand est-il préférable d’utiliser une carte de crédit ING plutôt qu’une carte de débit ING ?","acceptedAnswer":{"text":"<p>🌍 Lorsque vous effectuez des paiements dans des devises autres que l’euro car la marge de change est inférieure (2% vs 3,9%). Par contre il est toujours il est toujours préférable d’utiliser votre carte de débit ING lors de retraits au distributeur (dans la mesure du possible).&nbsp;&nbsp;</p><p>💸Une carte de crédit est également très pratique pour faire de gros achats en fin de mois car l’argent n’est débité de votre compte que plus tard, souvent au début ou au milieu du mois suivant.&nbsp;&nbsp;</p><p>🛡️ Enfin chaque paiement effectué avec votre carte de crédit est automatiquement protégé par des assurances supplémentaires.&nbsp;&nbsp;</p><p>👉&nbsp; Dans le doute il vaut toujours mieux payer vos gros achats ou vos réservations de vacances avec cette dernière&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Comment fonctionne une carte de crédit ?","acceptedAnswer":{"text":"<p>Contrairement à une carte de débit, les paiements effectués avec une carte de crédit ne sont pas immédiatement débités de votre compte bancaire, mais sont reportés à une date ultérieure, souvent au début ou au milieu du mois suivant.&nbsp;&nbsp;</p><p>Pour la Visa Classic : chaque période se clôture le 27 du mois. Le montant total dû pour cette période est automatiquement débité du compte courant ING lié à votre carte de crédit 9 jours calendriers plus tard.&nbsp;&nbsp;</p><p>Pour la Mastercard Gold : chaque période se clôture le 7 du mois. Le montant total dû pour cette période est automatiquement débité du compte courant ING lié à votre carte de crédit 9 jours calendriers plus tard.&nbsp;&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Je veux une ING Visa Classic ! Je peux ?","acceptedAnswer":{"text":"<p>Vous êtes une personne physique majeure et vous possédez un&nbsp;<a href=\"https://www.ing.be/fr/particuliers/gerer-le-quotidien#current-accounts\">compte à vue ING</a>&nbsp;? Vous pouvez dès lors profiter d’un confort de paiement partout dans le monde avec votre carte de crédit ING Visa Classic.</p><p>Vous venez d'avoir 18 ans? Optez pour la <a href=\"carte-de-credit-jeune\">ING Visa Classic pour les étudiant</a><a href=\"carte-de-credit-jeune_1\">s</a> de 18 à 25 ans.&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Combien coûte une carte de credit ING Visa Classic  ?","acceptedAnswer":{"text":"<ul><li><strong>Frais de gestion</strong>&nbsp;: la carte de crédit ING Visa Classic coûte 2,25 euros par mois et 0,83 euros par mois si vous avez moins de 26 ans.</li><li><strong>Paiements</strong>&nbsp;: tous vos paiements (hôtels, restaurants, boutiques, supermarchés...) sont gratuits dans la zone SEPA. Cette dernière désigne l’ensemble des pays ayant choisi l’euro comme monnaie unique.&nbsp;Pour un montant dans une autre devise que l'euro, une marge de change de 2 % s'applique sur le montant de votre paiement.</li><li><strong>Retraits :</strong>&nbsp;vous payez pour vos retraits d'espèces en euros aux distributeurs automatiques un forfait de 6 euros + 1 % du montant prélevé. Pour les retraits d'espèces en euros dans les agences bancaires, vous payez un forfait de 8 euros + 1 % du montant prélevé. Pour un montant dans une autre devise que l'euro, vous payez une marge de change de 2 % sur le montant retiré.</li><li><strong>Carte de remplacement</strong>: gratuit en cas de défaut. 9,99€ en cas de perte ou de vol.</li><li><strong>Augmenter la limite</strong>: gratuit en ligne et par call. En cas de changement au guichet, gratuit pour un titulaire de compte Vert ING et 5€ pour un titulaire de compte ING Lion Account.</li></ul>","@type":"Answer"},"@type":"Question"},{"name":"Quelle est la limite de cette carte de crédit ?","acceptedAnswer":{"text":"<p>La limite d'utilisation mensuelle standard est de 2.000 euros. Si vous désirez <a href=\"https://ebanking.ing.be/banking/mobile/daily-banking/modify-credit-card-limit?EW=true\">augmenter cette limite</a>, vous pouvez en faire la demande directement <span lang=\"en-BE\" dir=\"ltr\"><span><span>via vos canaux digitaux</span></span></span>. Votre demande sera soumise à l'approbation d'un conseiller.&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Quelle sécurité pour mes achats en ligne ?","acceptedAnswer":{"text":"<p>Grâce à Verified by Visa,&nbsp;<a href=\"https://www.ing.be/fr/particuliers/gerer-le-quotidien/payer-sur-internet\">vous payez en toute sécurité</a>&nbsp;avec votre carte de crédit auprès des magasins en ligne participants. Vos achats, effectués sur internet, sont en plus assurés contre la non-livraison et la livraison non conforme, et ce à concurrence de 750 euros au maximum par an. Découvrez les 3 assurances gratuites dont vous bénéficiez avec votre ING Visa Classic, dont <a href=\"carte-visa-classic-assurances\">la livraison des biens achetés sur internet.&nbsp;</a></p>","@type":"Answer"},"@type":"Question"},{"name":"Quelles assurances sont comprises ?","acceptedAnswer":{"text":"<p>En tant que titulaire d'une carte de crédit ING Visa Classic, vous profitez de 3 assurances incluses :</p><ul><li><strong>La garantie achat</strong>&nbsp;</li><li><strong>L'assurance \"Livraison des biens achetés sur internet\"</strong>&nbsp;</li><li><strong>L'assurance accident de voyage</strong>&nbsp;</li></ul><p>Découvrez <a href=\"assurance-carte-de-credit\">quelles assurances sont comprises</a> avec votre carte de crédit.&nbsp;</p><p>Retrouvez <a href=\"carte-visa-classic-assurances\">ici</a>&nbsp;le détail des couvertures ainsi que la procédure à suivre pour introduire une déclaration de sinistre.</p><p>Pour toutes informations complémentaires sur ces assurances, veuillez lire&nbsp;<a href=\"https://assets.ing.com/m/607dd086c6d50800/original/ReglementINGVisaClassicVisaGoldMCGoldNewFR.pdf\">les conditions générales</a>.</p>","@type":"Answer"},"@type":"Question"},{"name":"Comment activer ma carte de crédit ING Visa Classic une fois reçue ?","acceptedAnswer":{"text":"<p>Vous trouverez les étapes à suivre dans&nbsp;<a href=\"activer-carte-de-credit\">cet article</a>, ou jetez un oeil à <a href=\"mes-cartes-tutoriels-videos\">nos vidéos</a> qui vous expliquent comment gérer au mieux vos cartes de débit et de crédit.&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Que faire pour utiliser ma carte de crédit à l'étranger ?","acceptedAnswer":{"text":"<p>Chez ING, votre carte de crédit est automatiquement activée pour une utilisation à l’étranger, contrairement à certaines banques. Vous n’avez donc à vous occuper de rien ! Votre carte de crédit n’est restreinte à aucune région. Vous pouvez donc effectuer des paiements et des retraits d'espèces depuis n’importe quel pays, en toute liberté et toute sécurité.</p><p>Besoin de modifier votre plafond avant de partir ? <a href=\"mes-cartes\">Faites-le facilement en ligne</a>.&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Puis-je l'utiliser pour effectuer des retraits en espèces ?","acceptedAnswer":{"text":"<p>Bien sûr ! C’est possible dans tous les distributeurs et dans les agences bancaires affichant le logo Visa, en Belgique et à l’étranger ! Trouvez facilement <a href=\"https://www.ing.be/fr/particuliers/services/agences\">où retirer de l'argent </a>avec votre carte de débit ou de crédit. N.B : Il n'est pas possible de déposer de l'argent sur une carte de crédit.&nbsp;<span lang=\"FR-BE\" dir=\"ltr\"><span><span><span>Il n’est pas possible d’effectuer un virement d’une Visa Classic vers un autre compte.</span></span></span></span></p>","@type":"Answer"},"@type":"Question"},{"name":"Comment et à quelle date s’effectue le remboursement de mes dépenses ING Visa Classic ?","acceptedAnswer":{"text":"<p>Le remboursement de vos dépenses mensuelles se fait automatiquement avec votre carte de crédit ING Visa Classic. La clôture des dépenses est fixée au 27 de chaque mois et le&nbsp;<a href=\"https://www.ing.be/fr/particuliers/gerer-le-quotidien/comparatif-compte-bancaire\">compte à vue ING</a>&nbsp;lié à votre carte Visa est débité 9 jours de calendrier plus tard. Vous ne devez donc vous soucier de rien !</p>","@type":"Answer"},"@type":"Question"},{"name":"Comment garder un oeil sur mes dépenses ?","acceptedAnswer":{"text":"<p><a href=\"releves-de-depenses-en-ligne\">Vérifiez vos dépenses</a> quand vous voulez : vous pouvez vérifier vos dépenses, du mois en cours et du mois précédent, via nos applications sécurisées pour&nbsp;<a href=\"https://www.ing.be/fr/particuliers/gerer-le-quotidien/app-banque-ing-banking-facile\">smartphone</a>&nbsp;ou&nbsp;<a href=\"https://www.ing.be/fr/particuliers/gerer-le-quotidien/pc-banking\">Home'Bank</a>. Vous accédez facilement à un aperçu détaillé de vos dépenses et du montant disponible. Vous êtes donc toujours parfaitement informé du montant disponible pour régler vos achats avec votre carte de crédit ING Visa Classic.</p>","@type":"Answer"},"@type":"Question"},{"name":"Une question liée aux dépenses de ma carte de crédit ?","acceptedAnswer":{"text":"<p>Les informations relatives aux transactions effectuées à l’aide de votre carte de crédit sont disponibles sur le site <a href=\"https://macarte.be/fr/home/help.html\">macarte.be</a>. &nbsp;<br />Vous y trouverez notamment</p><ul><li>comment demander une copie de votre état de dépenses&nbsp;</li><li>comment contester un achat via ce formulaire: <a href=\"https://macarte.be/fr-be/home/how-can-we-help/forms/purchase-dispute\">Contester un achat - Worldline Belgique</a></li></ul>","@type":"Answer"},"@type":"Question"},{"name":"Où retrouver les relevés de dépenses de ma carte de crédit ?","acceptedAnswer":{"text":"<p>Les relevés mensuels de dépenses des cartes de crédit Visa classic, Visa Gold et Mastercard Gold sont disponibles gratuitement</p><ul><li><strong>en ligne, via Zoomit </strong></li><li><strong>ou en format papier</strong>, envoyés par la Poste<strong> </strong></li></ul><p>Si vous recevez vos <strong>extraits de compte</strong> de manière électronique, les relevés de dépenses de votre carte de crédit sont également disponibles <strong>en ligne, via Zoomit</strong>. L’enregistrement en Zoomit est automatique&nbsp;; vous ne devez rien faire&nbsp;!</p><p>Découvrez <a href=\"releves-de-depenses-en-ligne\">en détail</a>&nbsp;comment ça marche.</p><p>&nbsp;</p><p>Si vous recevez <strong>vos relevés de dépenses carte de crédit en format papier, </strong>vous pouvez gérer le mode d’envoi dans l’app ING Banking et Home’Bank, et opter pour la version électronique.&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Combien de temps ma carte de crédit est-elle valable ?","acceptedAnswer":{"text":"<p><span><span><span><span><span>La validité de votre </span></span></span><span><span><span>carte de crédit</span></span></span><span><span><span> est de 5 ans. Elle est automatiquement renouvelée et une nouvelle carte vous est envoyée 2 mois avant la date d’échéance.</span></span></span></span></span></p>","@type":"Answer"},"@type":"Question"},{"name":"Carte de crédit perdue ou volée ?","acceptedAnswer":{"text":"<p>Consultez <a href=\"https://www.ing.be/fr/particuliers/gerer-le-quotidien/bloquer-carte-perdue-ou-volee\">cette&nbsp;page</a>&nbsp;avec les instructions pour bloquer votre carte.</p>","@type":"Answer"},"@type":"Question"},{"name":"D'autres questions pratiques?","acceptedAnswer":{"text":"<p>Vous avez d'autres questions sur votre ING Visa Classic ? Découvrez comment vérifier&nbsp;<a href=\"verifier-code-pin\">votre code Pin</a>, <a href=\"debloquer-carte-de-credit\">débloquer votre carte de crédit</a>, comment <a href=\"activer-carte-de-credit\">l'activer </a>ou encore comment <a href=\"gerez-vos-cartes-de-credit\">gérer vos cartes de crédit</a>.&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Comment augmenter le plafond de ma carte de crédit depuis l’app ING Banking ?","acceptedAnswer":{"text":"<p>Depuis l’onglet «&nbsp;Aperçu&nbsp;», appuyez sur «&nbsp;Services&nbsp;» en bas à droite de votre écran. Sélectionnez ensuite l’option «&nbsp;Limites » dans le menu «&nbsp;Gérer vous-même&nbsp;». Choisissez ensuite «&nbsp;Carte de crédit » et suivez les différentes étapes.</p>","@type":"Answer"},"@type":"Question"},{"name":"Comment modifier la réception de mes relevés de dépenses ING Visa Classic ?","acceptedAnswer":{"text":"<p>Depuis l’onglet «&nbsp;Aperçu&nbsp;», appuyez sur «&nbsp;Services&nbsp;» en bas à droite de votre écran. Sélectionnez ensuite l’option «&nbsp;Cartes&nbsp;» dans le menu «&nbsp;Gérer vous-même&nbsp;». Choisissez ensuite «&nbsp;Changer la réception de vos relevés de carte de crédit » et suivez les différentes étapes.</p>","@type":"Answer"},"@type":"Question"},{"name":"Comment bloquer ou supprimer une domiciliation sur ma carte de crédit Visa Classic ?","acceptedAnswer":{"text":"<p>Pour bloquer ou supprimer une domiciliation en euros (SEPA) de votre carte de crédit Visa Classic, vous devez directement contacter le site internet ou le fournisseur qui effectue le prélèvement.</p>","@type":"Answer"},"@type":"Question"},{"name":"Que dois-je faire si je rencontre une erreur lors de la demande d’une carte de crédit Visa Classic ?","acceptedAnswer":{"text":"<p>Vérifiez d’abord que les données que vous avez saisies sont correctes. Il est également possible que votre carte d’identité ne soit plus à jour dans notre système. Vous pouvez mettre à jour votre carte d’identité en introduisant le code PIN de celle-ci au Kiosk dans une agence ING. Il peut aussi s’agir d’un problème technique. Veuillez essayer avec un autre navigateur ou réinitialiser les cookies de votre navigateur.</p>","@type":"Answer"},"@type":"Question"},{"name":"Comment récupérer un solde positif qui a été crédité sur ma carte de crédit ?","acceptedAnswer":{"text":"<p>Lorsque le montant d’une transaction carte de crédit est remboursé par un marchand, le montant est ajouté au disponible de la carte.</p><p>Si <strong>le 22 du mois</strong> votre carte présente un solde positif, <strong>ce montant est automatiquement remboursé sur votre compte à vue.</strong></p><p>Vous ne souhaitez pas attendre le 22 du mois&nbsp;? Faites la demande directement via <a href=\"https://macarte.be/fr-be/home/how-can-we-help/forms/positive-balance\">macarte.be</a></p>","@type":"Answer"},"@type":"Question"}],"@context":"https://schema.org","@type":"FAQPage"}</script>
