<script type="application/ld+json">{"mainEntity":[{"name":"Wat gebeurt er met mijn rekening met ING als ik 18 word?","acceptedAnswer":{"text":"<p><span><span><span><span>Je </span></span></span></span><span><span><span><span>Go to 18 rekening met ING wordt automatisch een <strong>ING Go Pack</strong>. Het behoudt hetzelfde rekeningnummer, maar vanaf nu heb alleen jij toegang.&nbsp;</span></span></span></span></p><p><span><span><span><span>Eenmaal geopend kun je eenvoudig het saldo van je ING-zichtrekening controleren op je smartphone via de ING Banking-app, op je computer via Home’Bank of door een kantoor te bezoeken.</span></span></span></span></p>","@type":"Answer"},"@type":"Question"},{"name":"Moet ik iets doen op mijn verjaardag?","acceptedAnswer":{"text":"<p><span><span><span>Ja! Om je rekeningupdate te voltooien, open de ING Banking-app en:</span></span></span></p><ol><li>Bevestig je persoonlijke gegevens</li><li><span><span><span>Bekijk de documenten van het ING Go Pack</span></span></span></li><li><span><span><span>Aanvaard onze algemene voorwaarden</span></span></span></li></ol><p><span><span><span>Je vindt alles onder Berichten &gt; “Voer je formaliteiten online uit”.</span></span></span></p>","@type":"Answer"},"@type":"Question"},{"name":"Kunnen mijn ouders mij nog helpen met mijn rekening?","acceptedAnswer":{"text":"<p><span><span><span><span>Als je niets doet, hebben je ouders geen toegang meer tot je ING Go zichtrekening. Als je hen toegang wilt blijven geven, moet je overstappen naar ING More 18-25. Voor je spaarrekening kun je hen eenvoudig volmacht geven zodat ze je rekening kunnen bekijken of beheren. Stel het in via de ING Banking-app of in een kantoor; jij kiest.</span></span></span></span></p>","@type":"Answer"},"@type":"Question"},{"name":"Wat zijn ING+ Deals en hoe krijg ik ze?","acceptedAnswer":{"text":"<p><span><span><span>ING+ Deals Youth Picks geven je cashback en kortingen op merken die je al leuk vindt, zoals Adidas, Uber Eats, ING Arena en meer. Je hoeft alleen je favoriete deals in je app te claimen en te beginnen met besparen. Cashback is automatisch en gratis voor ING Go- en ING More-klanten.</span></span></span></p>","@type":"Answer"},"@type":"Question"},{"name":"Kan ik nu ik 18 ben beginnen met beleggen?","acceptedAnswer":{"text":"<p><span><span><span>Ja! Je hebt nu toegang tot gebruiksvriendelijke beleggingsinstrumenten zoals <strong>Invest Up</strong> en <strong>Easy Invest</strong>. Invest Up laat je aankopen afronden en het verschil beleggen, terwijl Easy Invest je laat starten met beleggen in slechts enkele tikken. Bezoek de hierboven gelinkte pagina’s om meer te ontdekken.</span></span></span></p>","@type":"Answer"},"@type":"Question"}],"@context":"https://schema.org","@type":"FAQPage"}</script>
