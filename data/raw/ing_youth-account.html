<script type="application/ld+json">{"mainEntity":[{"name":"Is a youth account really free?","acceptedAnswer":{"text":"<p>Yes. The ING Go to 18 account is free of charge for young people aged 8 to 17. There is no monthly fee for the account or the associated debit card.</p><p>Find out more here:</p><ul><li>Our <a href=\"https://assets.ing.com/m/4f78f60fd9714d80/pricing-list-private-new-en.pdf\">Charges Applied to the Main Banking Services and Transactions for private use (PDF)</a></li><li>The <a href=\"https://assets.ing.com/m/60f1aea7c1fe493f/fee-information-document-ing-go-to-18-account-new-EN.pdf\">Fee Information Document - ING Go to 18 Account (PDF)</a></li></ul>","@type":"Answer"},"@type":"Question"},{"name":"Who can open an ING Go To 18 Account?","acceptedAnswer":{"text":"<p>The ING Go to 18 account is designed for children and young people between the ages of 8 and 17. The application must be submitted by a parent or legal guardian.</p>","@type":"Answer"},"@type":"Question"},{"name":"Can I open an ING Go to 18 account even if I’m not an ING customer?","acceptedAnswer":{"text":"<p>Yes. Even if you are not yet an ING customer, you can open an ING Go to 18 account for your child. You can easily start the application online<span><span> via this <a href=\"onboarding-non-ing-parent-go-to-18-open\">link.</a></span></span></p>","@type":"Answer"},"@type":"Question"},{"name":"Can I open an account for a child younger than 8?","acceptedAnswer":{"text":"<p>No. The ING Go to 18 account is available for children aged 8 and above.</p><p>If you would like to start saving for your child earlier, you can open a savings account. This allows you to build savings for their future from an early age. You can find all information about the savings account <a href=\"saving-for-children-and-young-people\">here</a>.</p><p><br />&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"How do I open an ING Go to 18 current account?","acceptedAnswer":{"text":"<p>I'm already an ING customer. You can easily open an ING Go to 18 account via the ING Banking app or Home’Bank. In the ING Banking app:</p><p>1. Tap \"Current Accounts\" under the \"Products\" tab.</p><p>2. Select the \"ING Go to 18\" option.</p><p>3. Tap \"Request your free youth account\".</p><p>&nbsp;</p><p>Not yet an ING customer? You can apply for the account online via<a href=\"onboarding-non-ing-parent-go-to-18-open\"> this link</a>. We'll guide you through the process step by step.</p>","@type":"Answer"},"@type":"Question"},{"name":"Who is the holder of an ING Go to 18 account?","acceptedAnswer":{"text":"<p>The ING Go to 18 account is exclusively held in the child's name. Only one account holder is permitted, and it is not possible to grant power of attorney on this youth account.</p><p>However, the parent has full visibility over the account via the Children Overview.</p>","@type":"Answer"},"@type":"Question"},{"name":"How can I access my child's ING Go to 18 account?","acceptedAnswer":{"text":"<p>With the Children Overview feature in the ING Banking app, you can easily keep track of your minor child’s account.</p><p><span><span><span>From this overview, you can easily:</span></span></span></p><ul><li><span><span><span><span><strong>View recent&nbsp;transactions</strong></span></span></span></span></li><li><span><span><span><span><strong>Temporarily pauze or reactivate the debit card</strong>&nbsp;</span></span></span></span></li><li><strong>Manage card and payment settings</strong></li><li><strong>Transfer pocket money directly to your child's account</strong></li></ul><p>This gives you a simple and secure way to stay informed.&nbsp;<br /><span><span><span><a href=\"https://www.ing.be/en/individuals/minors/children-overview\">Learn more about the Children overview feature</a>.</span></span></span></p>","@type":"Answer"},"@type":"Question"},{"name":"What level of control do I have as a parent over the youth account?","acceptedAnswer":{"text":"<p>With the Children Overview feature in the ING Banking app, you can keep an eye on your child’s account and banking activities.</p><p>You can:</p><ul><li>Monitor recent transactions;</li><li>Manage card settings;</li><li>Adjust certain payment and withdrawal limits;</li><li>Temporarily block or reactivate the card.</li></ul><p>&nbsp;</p><p>This helps your child learn how to manage money responsibly, step by step.</p>","@type":"Answer"},"@type":"Question"},{"name":"Does my child receive a payment card with the ING Go to 18 account?","acceptedAnswer":{"text":"<p>Yes. The ING Go to 18 account includes a debit card that allows your child to pay securely in shops, make online purchases and withdraw cash from ATMs.</p><p>Contactless payments are also available. The child can use the ING Banking app as from the age of 8.</p>","@type":"Answer"},"@type":"Question"},{"name":"What happens if the debit card is lost or stolen?","acceptedAnswer":{"text":"<p>If your child’s debit card is lost or stolen, you can immediately block it through the ING Banking app.</p><p>You can then easily request a replacement card. The first replacement for a lost or stolen card is free of charge.</p><p>For more information, please visit our <a href=\"block-lost-stolen-card-is-your-card-lost-or-stolen\">support page on lost or stolen cards</a>.</p>","@type":"Answer"},"@type":"Question"},{"name":"What happens when my child turns 18?","acceptedAnswer":{"text":"<p>When your child turns 18, the ING Go to 18 account is automatically converted into an ING Go pack. Your child can continue using their account and everyday banking services without interruption. The ING Go pack is free for young adults aged 18 to 25. As a result, the monthly package fee only applies from the age of 26 onwards.</p><p>From age 18, your child manages the account independently. Any parental access or control ends unless further steps are taken. Read more information for <a href=\"turning18_forparents\">parent </a>and <a href=\"youth-turning-18\">child</a>.</p>","@type":"Answer"},"@type":"Question"}],"@context":"https://schema.org","@type":"FAQPage"}</script>
