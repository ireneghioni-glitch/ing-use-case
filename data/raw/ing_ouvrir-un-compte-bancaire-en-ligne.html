<script type="application/ld+json">{"mainEntity":[{"name":"Comment ouvrir un compte bancaire en ligne en Belgique ?","acceptedAnswer":{"text":"<p>Vous pouvez ouvrir un compte bancaire en ligne chez ING en quelques étapes : téléchargez l'application ING Banking sur l'App Store ou le Play Store, identifiez-vous avec itsme® ou votre carte d'identité, choisissez votre pack bancaire et accédez à votre compte dès que votre demande est validée. Dans la plupart des cas, aucune démarche administrative papier n'est nécessaire.</p>","@type":"Answer"},"@type":"Question"},{"name":"Puis-je ouvrir un compte bancaire sans me rendre en agence ?","acceptedAnswer":{"text":"<p>Oui, dans la plupart des cas, ING vous permet d'ouvrir un compte bancaire entièrement en ligne, sans vous rendre en agence. Si vous préférez bénéficier d'un accompagnement personnalisé, vous pouvez également ouvrir un compte auprès d'une agence ING.</p>","@type":"Answer"},"@type":"Question"},{"name":"Combien de temps faut-il pour ouvrir un compte ING en ligne ?","acceptedAnswer":{"text":"<p>L'ouverture de votre compte ne prend généralement que quelques minutes, sous réserve de la vérification de votre identité.</p>","@type":"Answer"},"@type":"Question"},{"name":"Quel compte bancaire choisir ?","acceptedAnswer":{"text":"<p>Cela dépend de vos besoins : choisissez ING Go pour les opérations bancaires du quotidien, ING More ou ING Extra pour bénéficier d'avantages supplémentaires, ou ING Max pour profiter de services premium.</p>","@type":"Answer"},"@type":"Question"},{"name":"L'ouverture d'un compte bancaire en ligne est-elle sécurisée ?","acceptedAnswer":{"text":"<p>Oui. ING utilise des méthodes d'authentification sécurisées telles qu'itsme® ainsi que des technologies de chiffrement avancées.</p>","@type":"Answer"},"@type":"Question"},{"name":"Les expatriés peuvent-ils ouvrir un compte bancaire en ligne en Belgique ?","acceptedAnswer":{"text":"<p>Oui. ING propose des solutions bancaires spécialement adaptées aux <a href=\"index\">expatriés vivant en Belgique</a>.</p>","@type":"Answer"},"@type":"Question"},{"name":"Puis-je ouvrir un compte bancaire en ligne sans numéro de registre national belge (NRN) ?","acceptedAnswer":{"text":"<p>Oui. Dans de nombreux cas, vous pouvez ouvrir un compte bancaire en ligne sans numéro de registre national belge (NRN). Si nécessaire, vous disposerez de 90 jours pour le fournir. Si vous devenez résident fiscal belge ou séjournez en Belgique pendant plus de quatre mois, vous pourriez devoir vous enregistrer localement et obtenir un NRN.</p>","@type":"Answer"},"@type":"Question"},{"name":"Est-il possible d'ouvrir un compte bancaire sans l'application ?","acceptedAnswer":{"text":"<p>Oui. Bien que l'application ING Banking soit le moyen le plus rapide et le plus pratique pour ouvrir la plupart des packs bancaires en ligne, vous pouvez également ouvrir un compte via Home'Bank ou avec l'aide d'une agence ING. Selon le produit choisi, les canaux disponibles et le processus d'ouverture peuvent varier. Consultez la page du produit concerné pour obtenir les informations et options de souscription spécifiques.</p>","@type":"Answer"},"@type":"Question"},{"name":"Quels types de comptes bancaires puis-je ouvrir chez ING ?","acceptedAnswer":{"text":"<p>ING propose différents packs bancaires en fonction de votre situation. La plupart des clients peuvent choisir parmi les packs ING Go, More, Extra et Max et ouvrir leur compte entièrement en ligne.</p><p>ING propose également :</p><ul><li>Des comptes pour les <a href=\"index_1\">enfants</a>, les <a href=\"jongerenrekening\">jeunes</a>&nbsp;et les <a href=\"index_3\">jeunes adultes</a>&nbsp;(gratuits jusqu'à 25 ans).</li><li>Des solutions bancaires pour les <a href=\"index\">expatriés résidant en Belgique</a>.</li><li>Des comptes proposés dans le cadre du ​​​​​​​<a href=\"basic-banking-service-account\">Service bancaire de base</a>.</li><li>Le ​​​​​​​<a href=\"universal-account\">Compte Vert ING</a>&nbsp;(un compte à vue destiné aux opérations bancaires courantes et accessible aux bénéficiaires du service bancaire universel).</li><li>Des <a href=\"ouvrir-un-compte-professionnel\">comptes professionnels pour les indépendants</a> et les entreprises.</li><li>Des solutions bancaires destinées à certaines professions, telles que les ​​​​​​​<a href=\"professionnel-sante\">professions médicales</a>&nbsp;et les ​​​​​​​<a href=\"privalis-avocats\">avocats</a>.</li></ul><p>La procédure de demande et les conditions peuvent varier selon le type de compte. Consultez la page produit concernée pour plus d’informations.</p>","@type":"Answer"},"@type":"Question"}],"@context":"https://schema.org","@type":"FAQPage"}</script>
