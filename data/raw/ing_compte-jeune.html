<script type="application/ld+json">{"mainEntity":[{"name":"Le compte jeunes est-il vraiment gratuit ?","acceptedAnswer":{"text":"<p>Oui. Le compte ING Go to 18 est gratuit pour les jeunes âgés de 8 à 17 ans. Aucun frais mensuel n'est facturé pour le compte ni pour la carte de débit associée.</p><p>Vous souhaitez en savoir plus ?</p><ul><li>Consultez le&nbsp;<a href=\"https://assets.ing.com/m/2b3db8a304d9bdb0/pricing-list-private-new-fr.pdf\">Tarif des principaux services et opérations bancaires à usage privé (PDF)</a></li><li>D<a href=\"https://assets.ing.com/m/fb376c3aba034959/fee-information-document-ing-go-to-18-account-FR.pdf\">ocument d'information tarifaire - Compte ING Go to 18 (PDF)</a></li></ul>","@type":"Answer"},"@type":"Question"},{"name":"Qui peut ouvrir un compte ING Go to 18 ?","acceptedAnswer":{"text":"<p>Le compte ING Go to 18 est destiné aux enfants et aux jeunes âgés de 8 à 17 ans. La demande doit être introduite par un parent ou un représentant légal.</p>","@type":"Answer"},"@type":"Question"},{"name":"Puis-je ouvrir un compte ING Go to 18 même si je ne suis pas client ING ?","acceptedAnswer":{"text":"<p>Oui. Même si vous n'êtes pas encore client ING, vous pouvez ouvrir un compte ING Go to 18 pour votre enfant.</p><p>Introduisez facilement votre demande en ligne via&nbsp;<span><span><a href=\"onboarding-non-ing-parent-go-to-18-open\">ce lien</a>.</span></span></p>","@type":"Answer"},"@type":"Question"},{"name":"Puis-je ouvrir un compte pour un enfant de moins de 8 ans ?","acceptedAnswer":{"text":"<p>Non. Le compte ING Go to 18 est accessible à partir de l'âge de 8 ans.</p><p>Si vous souhaitez commencer à épargner plus tôt pour votre enfant, vous pouvez ouvrir un compte d'épargne ING. Vous pourrez ainsi constituer progressivement une épargne pour son avenir.</p><p>Retrouvez toutes les informations relatives à ce compte d'épargne via <a href=\"apercu-enfants\">ce lien.</a></p>","@type":"Answer"},"@type":"Question"},{"name":"Comment ouvrir un compte à vue ING Go to 18 ?","acceptedAnswer":{"text":"<p>Vous êtes déjà client ING ? Vous pouvez facilement ouvrir un compte ING Go to 18 via l'application ING Banking ou Home'Bank.</p><ol><li>Sélectionnez « Comptes à vue » dans l'onglet « Produits ».</li><li>Choisissez l'option « ING Go to 18 ».</li><li>Cliquez sur « Demander votre compte jeunes gratuit ».</li></ol><p>&nbsp;</p><p>Vous n'êtes pas encore client ING ? Vous pouvez introduire votre demande en ligne via<a href=\"onboarding-non-ing-parent-go-to-18-open\"> ce lien</a>. Nous vous guidons étape par étape.</p>","@type":"Answer"},"@type":"Question"},{"name":"Qui est le titulaire d'un compte ING Go to 18 ?","acceptedAnswer":{"text":"<p>Le compte ING Go to 18 est exclusivement ouvert au nom de l'enfant. Un seul titulaire est autorisé et il n'est pas possible d'ajouter une procuration sur ce compte jeunes.</p><p>Le parent conserve toutefois une visibilité complète sur le compte grâce à la fonctionnalité Aperçu Enfants.</p>","@type":"Answer"},"@type":"Question"},{"name":"Comment accéder au compte ING Go to 18 de mon enfant ?","acceptedAnswer":{"text":"<p>Grâce à la fonctionnalité Aperçu Enfants dans l'application ING Banking, vous pouvez facilement suivre le compte de votre enfant mineur.</p><p>Depuis cet aperçu, vous pouvez notamment :</p><ul><li><strong>Consulter les&nbsp;opérations récentes;</strong></li><li><strong>Suspendre temporairement ou réactiver la carte de débit;</strong></li><li><strong>Gérer les paramètres de la carte et des paiements;</strong></li><li><strong>Verser directement de l'argent de poche sur le compte de votre enfant.</strong></li></ul><p>Vous gardez ainsi un aperçu simple et sécurisé de ses opérations. En savoir plus sur la fonctionnalité Aperçu Enfants.</p><p>&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Quel contrôle ai-je en tant que parent sur le compte jeunes ?","acceptedAnswer":{"text":"<p>Grâce à la fonctionnalité Aperçu Enfants dans l'application ING Banking, vous gardez un œil sur le compte et les activités bancaires de votre enfant.</p><p>Vous pouvez :</p><ul><li>Suivre les opérations récentes ;</li><li>Gérer les paramètres de la carte ;</li><li>Adapter certains plafonds de paiement et de retrait ;</li><li>Bloquer temporairement ou réactiver la carte.</li></ul><p>Vous accompagnez ainsi votre enfant dans l'apprentissage d'une gestion responsable de son argent, étape par étape.</p>","@type":"Answer"},"@type":"Question"},{"name":"Mon enfant reçoit-il une carte de paiement avec le compte ING Go to 18 ?","acceptedAnswer":{"text":"<p>Oui. Le compte ING Go to 18 comprend une carte de débit qui permet à votre enfant de payer en toute sécurité en magasin, d'effectuer des achats en ligne et de retirer de l'argent aux distributeurs.</p><p>Le paiement sans contact est également disponible.</p><p>Votre enfant peut utiliser l'application ING Banking dès l'âge de 8 ans.</p>","@type":"Answer"},"@type":"Question"},{"name":"Que se passe-t-il si la carte de débit est perdue ou volée ?","acceptedAnswer":{"text":"<p>Si la carte de débit de votre enfant est perdue ou volée, vous pouvez immédiatement la bloquer via l'application ING Banking.</p><p>Vous pouvez ensuite demander facilement une nouvelle carte. Le premier remplacement d'une carte perdue ou volée est gratuit.</p><p>Pour plus d'informations, consultez notre page d'assistance consacrée à la perte ou au vol d'une carte.</p>","@type":"Answer"},"@type":"Question"},{"name":"Que se passe-t-il lorsque mon enfant atteint l'âge de 18 ans ?","acceptedAnswer":{"text":"<p>Lorsque votre enfant atteint l'âge de 18 ans, le compte ING Go to 18 est automatiquement transformé en pack ING Go. Il conserve ainsi son compte et ses services bancaires quotidiens sans interruption. Le pack ING Go est gratuit pour les jeunes adultes de 18 à 25 ans. Les frais mensuels du pack ne sont donc appliqués qu'à partir de l'âge de 26 ans.</p><p>&nbsp;</p><p>À partir de ses 18 ans, votre enfant gère son compte de manière autonome. Tout accès ou contrôle parental prend fin, sauf démarche complémentaire. Découvrez plus d'informations pour<a href=\"turning18_forparents\"> les parents</a> et <a href=\"youth-turning-18\">les enfants</a>.</p>","@type":"Answer"},"@type":"Question"}],"@context":"https://schema.org","@type":"FAQPage"}</script>
