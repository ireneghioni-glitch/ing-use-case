<script type="application/ld+json">{"mainEntity":[{"name":"Puis-je utiliser ma carte de débit ING pour accéder à ma banque en ligne ? ","acceptedAnswer":{"text":"<p>Votre carte de débit ING vous permet de :&nbsp;</p><ul><li>vous connecter à Home'Bank&nbsp;ou Business Bank: la banque en ligne d'ING</li><li>accéder aux points CASH&nbsp;ou aux distributeurs&nbsp;situés dans les agences ING afin d'y gérer vous-même vos opérations bancaires.</li></ul><p>Votre carte de débit vous sert aussi à créer votre profil pour l'app ING Banking. Vous pourrez ensuite gérer vos affaires bancaires depuis votre smartphone.</p>","@type":"Answer"},"@type":"Question"},{"name":"L'utilisation de ma carte de débit est -elle sécurisée ?","acceptedAnswer":{"text":"<p>Oui ! Et cette sécutité est garantie grâce à votre code PIN. Votre carte de débit ING&nbsp;&nbsp;est strictement personnelle et ne peut être utilisée qu'avec le code d'identification personnel que vous êtes la/le seul(e) à connaître. Ne divulguez jamais votre code et ne l’inscrivez nulle part. Choisissez un code dont vous vous souvenez facilement mais qui reste difficile à deviner.</p><p>&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Comment fonctionne une réservation lors d'une transaction par carte de débit?","acceptedAnswer":{"text":"<p>Les réservations pour les transactions par carte de débit concernent les fonds bloqués temporairement sur votre compte bancaire afin de garantir que votre compte dispose des fonds nécessaires et ainsi vous protéger contre les risques de débit irrégulier.</p><p><strong>Fonctionnement des réservations :</strong></p><ol><li>Autorisation initiale : Lorsqu'une transaction est initiée, le marchand effectue une demande d'autorisation auprès d’ING qui vérifie si le montant disponible sur votre compte est suffisant pour couvrir le montant maximum de la transaction.</li><li>Réservation des fonds : Si l'autorisation est accordée, les fonds sont réservés, ce qui réduit temporairement le montant disponible sur votre compte.<br />Le montant de cette réservation peut être ajusté par la suite. Exemple :<br />-&nbsp; &nbsp;Achat de carburant&nbsp;: le montant initial de la réservation est défini par le&nbsp;<br />&nbsp; &nbsp;&nbsp;marchand&nbsp;et supérieur à l’achat potentiel. Une fois le plein effectué, la<br />&nbsp; &nbsp;&nbsp;réservation est ajusté au montant réel de l’achat et votre montant<br />&nbsp; &nbsp;&nbsp;disponible mis à jour.<br />-&nbsp; &nbsp;Garantie (hôtel, location de véhicule, …).<br />-&nbsp; &nbsp;Transactions en devise&nbsp;: la réservation en euro est un montant estimé, le<br />&nbsp; &nbsp; &nbsp;montant&nbsp;final de la transaction sera déterminé sur base du taux de<br />&nbsp; &nbsp; &nbsp;change au moment&nbsp;du traitement.</li><li>Traitement de la transaction : La transaction est ensuite traitée par le commerçant. Ce processus peut durer de quelques minutes à plusieurs jours. Une fois la transaction finalisée, les fonds réservés sont soit confirmés et débités du compte, soit annulés.</li></ol><p><strong>Conséquences pour le titulaire de la carte :</strong></p><ul><li>Montant disponible réduit : Le montant réservé est temporairement inaccessible, ce qui affecte votre montant disponible pour d'autres transactions.</li><li>Durée de réservation : Ce processus peut durer de quelques minutes à plusieurs jours, selon les pratiques du commerçant.</li><li>Annulation : Si un achat est annulé, les fonds réservés seront libérés dès que le commerçant nous en informe.</li></ul>","@type":"Answer"},"@type":"Question"},{"name":"Comment activer/désactiver les paiements en ligne ?","acceptedAnswer":{"text":"<p>Réserver un vol ou des places de concert, commander des vêtements, acheter un ordinateur… Vous achetez de plus en plus sur Internet ? ING vous propose plusieurs solutions pour effectuer chaque paiement en ligne rapidement et en toute sécurité. Effectuez vos paiements en ligne par défaut avec votre carte de débit/carte de crédit. Mais vous pouvez facilement désactiver cette fonctionnalité dans les canaux digitaux.</p><p><strong>Attention</strong>&nbsp;: si vous désactivez les paiements en ligne, les paiements périodiques automatiques de vos abonnements (streaming, pare-feu, musique, …) en ligne liés à votre carte seront aussi refusés.</p><p>Pour activer/désactiver les paiements en ligne depuis l'app ING Banking, suivez les instructions ci-dessous.</p><ol><li>Appuyez sur « Services » en bas à droite..</li><li>Sélectionnez « Cartes ».</li><li>Choisissez « Cartes de débit » ou « Cartes de crédit ».</li><li><span><span><span><span><span><span>Sélectionnez « Paramètres &amp; limites »</span></span></span></span></span></span></li><li><span><span><span>Appuyez sur « Paiements en ligne ».&nbsp;</span></span></span></li></ol>","@type":"Answer"},"@type":"Question"},{"name":"Comment bloquer/débloquer temporairement ma carte ?","acceptedAnswer":{"text":"<p>Vous n'avez pas besoin temporairement de votre carte ? Vous ne la trouvez pas ? Ou vous ne savez pas si vous l'avez perdue ? Conseil utile: bloquez-la temporairement ! Vous pouvez facilement la débloquer quand vous la retrouvez ou quand vous souhaitez l'utiliser à nouveau.</p><p><strong>En cas de perte ou de vol</strong>, vous devez toujours impérativement bloquer votre carte via le service disponible dans l’App ING Banking ou dans Home’Bank/Business’Bank ou appeler Card Stop au +32 78 170 170 (L'envoi d'une nouvelle carte de débit ING coûte 9,99 euros).</p><p><strong>Attention&nbsp;: </strong>si vous bloquez temporairement votre carte, <strong>vous ne pouvez plus l’utiliser </strong>que ce soit&nbsp;:</p><ul><li>pour des retraits, des paiements y compris les paiements mobiles en Apple Pay, Google Pay ou Bancontact</li><li>pour les débits automatiques périodiques des vos abonnements en ligne (streaming, pare-feu, musique, …) liés à votre&nbsp;carte ou</li><li>pour vous&nbsp;connecter à Home’Bank/Business’Bank avec votre&nbsp;lecteur de carte ING.</li></ul><p>Pour&nbsp;bloquer/débloquer temporairement votre carte, suivez les instructions ci-dessous.</p>","@type":"Answer"},"@type":"Question"},{"name":"Quelles sont les limites pour les paiements, les virements ou le retrait d’espèces ?","acceptedAnswer":{"text":"<p><strong>Pour les petites dépenses (inférieures à 50 euros)</strong>: vous pouvez les effectuer sans contact.</p><p>Lorsque vous avez effectué des paiements sans contact pour un montant total de 100 EUR, il vous sera demandé de confirmer la dépense suivante avec votre code PIN avant de pouvoir à nouveau exécuter un paiement sans code PIN.</p><p><strong>Pour les montants plus importants</strong>,&nbsp;<a href=\"https://www.ing.be/fr/retail/daily-banking/current-accounts/limits\">consultez les limites de paiement, de virements (SEPA) et de retraits d'espèces en euros relatives à votre carte de débit ING</a>.</p><p>&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Où puis-je utiliser ma carte de débit ?","acceptedAnswer":{"text":"<p>Utilisez votre carte de débit ING pour effectuer vos paiements en Belgique et en ligne, ou encore pour retirer de l'argent aux distributeurs de billets pourvus du logo Bancontact, Maestro ou Mastercard (suivant la carte dont vous disposez actuellement). <strong>Avec votre carte de débit, vous pouvez effectuer des paiements et retraits d'espèces en Europe et dans le monde entier.</strong></p><p>Attention ! Il n'y a cependant pas de garantie à 100% qu’une carte de débit soit acceptée partout. Tous les distributeurs automatiques n'acceptent par exemple pas Maestro/Mastercard en Indonésie, Malaisie, Pérou, Equateur, Bolivie, Costa Rica, USA et Japon.</p><p>Nous vous conseillons toujours de prendre <strong>votre&nbsp;carte de crédit</strong> lors de déplacements hors Europe. <a href=\"https://www.ing.be/fr/particuliers/gerer-le-quotidien/comparatif-cartes-de-credit\">Plus d'informations sur les cartes de crédit chez ING.</a></p>","@type":"Answer"},"@type":"Question"},{"name":"Comment fonctionne le paiement sans contact ?","acceptedAnswer":{"text":"<p>Le paiement « sans contact » c'est facile: présentez votre carte quelques secondes devant un terminal avec le symbole des 4 ondes radio et c'est fait ! Pas besoin d'insérer votre carte dans le terminal ou d'introduire votre code PIN pour des montants inférieurs à 50 EUR max et pour 100 EUR max de transactions « sans contact » consécutives.&nbsp;Pour les dépenses supérieures à 50 euros, placez simplement votre carte sur le terminal de paiement et tapez votre code PIN pour confirmer.&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Comment activer/désactiver les paiements sans contact ?","acceptedAnswer":{"text":"<p>Par défaut, la carte de débit permet les paiements sans contact mais vous pouvez facilement désactiver cette fonction. Si vous désactivez la fonction \"paiement sans contact\", vous ne pourrez payer avec votre carte de débit/crédit qu'en l'introduisant dans un terminal.</p><p>Pour&nbsp;activer/désactiver les paiements sans contact , suivez les instructions ci-dessous :</p><p><span><span><span>Ouvrez votre app ING Banking ou Home’Bank. Sélectionnez “Services”, puis “Cartes” et choisissez “Cartes de debit”. Appuyez sur “Paramètres &amp; limites” et sélectionnez “Paiements sans contact”. </span></span></span></p><p>&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Comment suis-je averti des frais de change liés à un paiement effectué dans un état membre de l'UE dans une autre devise que l'euro  ?","acceptedAnswer":{"text":"<p>Lorsque vous utilisez votre carte dans un état membre de l’UE pour un paiement dans une autre devise que l’euro, vous recevez un SMS gratuit vous informant des frais de change. Vous recevez ce SMS à chaque premier paiement de chaque devise non-euro chaque mois.<br />Si vous choisissez consciemment de ne pas partager votre numéro de gsm avec ING, vous choisissez de ne pas recevoir ces informations de cette manière.<br />Vos frais restent consultables dans vos relevés de compte, dans l’App ING Banking ou via Home’bank, Business’Bank.</p>","@type":"Answer"},"@type":"Question"},{"name":"Comment demander une carte de débit supplémentaire ?","acceptedAnswer":{"text":"<p>Les Packs ING offrent une carte de débit par titulaire. Vous pouvez obtenir une carte supplémentaire pour le second titulaire ou mandataire de votre compte à vue.</p>","@type":"Answer"},"@type":"Question"},{"name":"Frais, tarifs et conditions générales","acceptedAnswer":{"text":"<p>Les frais pour votre carte de débit dépendent du compte auquel elle est liée. Dans la plupart des cas, vous avez droit à une carte de débit gratuite au minimum pour votre compte à vue. Pour plus de détails consultez&nbsp;<a href=\"https://www.ing.be/fr/retail/daily-banking/current-accounts/charges-and-regulations\">les tarifs d'ING pour des personnes physiques</a>, sous la rubrique compte à vue et cartes ainsi que le&nbsp;<a href=\"comparez-packs\">comparateur de comptes à vue ING.</a>&nbsp;Les conditions générales des cartes de débit se trouvent sous <a href=\"https://www.ing.be/fr/particuliers/gerer-le-quotidien/tarifs-et-reglements\">\"Informations et Règlements\" / \"Gérer le quotidien\"/\"Conditions générales\".</a></p>","@type":"Answer"},"@type":"Question"},{"name":"Le nom indiqué sur ma carte de débit ING est incorrect. Que dois-je faire ?","acceptedAnswer":{"text":"<p><span><span><strong><span><span><span>Le nom indiqué sur votre carte de débit est incorrect ? Vérifiez d'abord que votre nom est correctement enregistré dans l'app ING Banking ou Home'Bank.</span></span></span></strong></span></span></p><ul><li><span><span><span><span><strong><span><span>Si votre nom est correct dans l'app</span></span></strong><span><span>, vous pouvez commander vous-même une nouvelle carte de débit via <strong>Services &gt; Cartes &gt; Cartes de débit &gt; Commander une carte</strong>.</span></span></span></span></span></span></li><li><span><span><span><span><strong><span><span>Si votre nom n'est pas correct dans l'app</span></span></strong><span><span>, rendez-vous dans un <strong>POINT CASH</strong> avec votre carte d'identité afin de faire relire celle-ci et mettre vos données à jour. Commandez ensuite une nouvelle carte de debit depuis votre app ING Banking. </span></span></span></span></span></span></li></ul><p><span><span><span>Si le problème persiste après ces démarches, contactez-nous.</span></span></span></p>","@type":"Answer"},"@type":"Question"},{"name":"Je peux payer, retirer de l'argent et faire des achats en ligne avec ma carte de débit, mais je ne parviens pas à déposer du cash à un distributeur. Que dois-je faire ?","acceptedAnswer":{"text":"<p><span><span><span><span><span>Si votre carte de débit fonctionne normalement pour les paiements en magasin, les achats en ligne et les retraits d'espèces, mais que vous ne parvenez pas à déposer des billets à un automate, vérifiez d'abord que vous utilisez un automate qui accepte les dépôts d'espèces.</span></span></span></span></span></p><p><span><span><span>Si c'est bien le cas et que le problème persiste, il est possible qu'une vérification de votre identification soit nécessaire. Dans ce cas, rendez-vous dans une agence ING entre 9h00 et 12h00, muni(e) de votre carte d'identité. Un collaborateur ING pourra lire votre carte d'identité et vérifier que vos données sont correctement enregistrées afin de rétablir l'accès à la fonctionnalité de dépôt d'espèces.</span></span></span></p>","@type":"Answer"},"@type":"Question"},{"name":"J’ai commandé une carte de débit dans une agence ING. Quand pourrai-je la récupérer ?","acceptedAnswer":{"text":"<table><tbody><tr><td><p><span><span><strong><span><span><span>J’ai commandé une carte de débit dans une agence ING. Quand pourrai-je la récupérer ?</span></span></span></strong></span></span></p><p><span><span><span><span><span>Si vous avez choisi de faire livrer votre carte de débit dans une agence ING, vous serez averti(e) dès que celle-ci sera disponible. La notification est généralement envoyée par SMS (si votre numéro de GSM est enregistré chez ING) ou via vos extraits de compte. </span></span></span></span></span></p><p><span><span><span><span><span>Dès réception de cette notification, vous pouvez vous rendre dans l’agence indiquée pour récupérer votre carte.</span></span></span></span></span></p><p><span><span><span><span><span>Si vous n’avez pas encore reçu de notification et que plusieurs jours ouvrables se sont écoulés depuis votre demande, nous vous conseillons de nous contacter afin de vérifier son statut.</span></span></span></span></span></p><p><span><span><span><strong><span><span>Bon à savoir :</span></span></strong><span><span> si vous utilisez l’app ING Banking, votre nouvelle carte de débit peut également être disponible en version virtuelle avant la réception de la carte physique, vous permettant déjà d’effectuer certains paiements digitaux.</span></span></span></span></span></p><p>&nbsp;</p></td></tr></tbody></table>","@type":"Answer"},"@type":"Question"}],"@context":"https://schema.org","@type":"FAQPage"}</script>
