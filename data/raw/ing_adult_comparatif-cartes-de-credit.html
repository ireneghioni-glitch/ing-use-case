<script type="application/ld+json">{"mainEntity":[{"name":"Comment fonctionne une carte de crédit ?","acceptedAnswer":{"text":"<p>Contrairement à une carte de débit, les paiements effectués avec une carte de crédit ne sont pas immédiatement débités de votre compte bancaire, mais sont reportés à une date ultérieure, souvent au début ou au milieu du mois suivant.&nbsp;&nbsp;</p><p><strong>Pour la Visa Classic :</strong> chaque période se clôture le 27 du mois. Le montant total dû pour cette période est automatiquement débité du compte courant ING lié à votre carte de crédit 9 jours calendriers plus tard.&nbsp;&nbsp;</p><p><strong>Pour la Mastercard Gold : </strong>chaque période se clôture le 7 du mois. Le montant total dû pour cette période est automatiquement débité du compte courant ING lié à votre carte de crédit 9 jours calendriers plus tard.&nbsp;&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Quels frais puis-je être amené-e à payer ?","acceptedAnswer":{"text":"<p>Vous payez une cotisation mensuelle fixe (voir tableau comparatif ci-dessus). Vous avez payé en euros et vous avez suffisamment d’argent sur votre compte courant au moment de la clôture mensuelle ? Aucun frais supplémentaire ni intérêt ne s’applique.&nbsp;</p><p>🚫À savoir : des frais sont facturés si vous retirez de l’argent avec votre carte de crédit à un distributeur automatique. C’est pourquoi nous vous recommandons d’utiliser votre carte de débit ING pour ce type de retrait quand c’est possible, en Belgique comme à l’étranger.&nbsp;&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Quand est-il préférable d’utiliser une carte de crédit ING plutôt qu’une carte de débit ING ?","acceptedAnswer":{"text":"<p>🌍 Lorsque vous effectuez des paiements dans des devises autres que l’euro car la marge de change est inférieure (2% vs 3,9%). Par contre il est toujours il est toujours préférable d’utiliser votre carte de débit ING lors de retraits au distributeur (dans la mesure du possible).&nbsp;&nbsp;</p><p>💸Une carte de crédit est également très pratique pour faire de gros achats en fin de mois car l’argent n’est débité de votre compte que plus tard, souvent au début ou au milieu du mois suivant.&nbsp;&nbsp;</p><p>🛡️ Enfin chaque paiement effectué avec votre carte de crédit est automatiquement protégé par des assurances supplémentaires.&nbsp;&nbsp;</p><p>👉&nbsp; Dans le doute il vaut toujours mieux payer vos gros achats ou vos réservations de vacances avec cette dernière&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"En quoi consistent les assurances comprises avec ma carte de crédit ?","acceptedAnswer":{"text":"<p>Si vous êtes titulaire d’une carte de crédit ING Visa Classic, vous bénéficiez de 3 assurances incluses: la garantie d'achat, la livraison des biens achetés sur Internet ainsi que les accidents de voyages. <a href=\"carte-visa-classic-assurances\">Consultez notre article</a> afin de découvrir comment introduire la demande d'intervention auprès de l'assurance. (Assureurs: Zurich Insurance Europe AG, Belgian Branch et Cover-More). Vous optez pour une ING Mastercard Gold ou une Visa Gold? <a href=\"carte-gold-self-service\">Découvrez dans notre article</a> quelles sont vos assurances comprises.&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Puis-je facilement gérer ma carte de crédit ?","acceptedAnswer":{"text":"<p>Gérez facilement vos cartes de débit et de crédit, comme: consulter <a href=\"mes-cartes-tutoriels-videos_1\">votre relevé de dépenses</a>, modifier <a href=\"mes-cartes-tutoriels-videos\">votre plafond</a> ou remplacer <a href=\"mes-cartes\">votre carte défectueuse</a>.&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Comment puis-je gérer au mieux mes dépenses avec ma carte de crédit?","acceptedAnswer":{"text":"<p>Vous pouvez aisément et en ligne <a href=\"gerez-vos-cartes-de-credit\">gérer vos cartes de crédit</a> et vérifier <a href=\"releves-de-depenses-en-ligne\">vos relevés de dépenses.</a>&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Quelle est la référence client liée à ma carte de crédit ?","acceptedAnswer":{"text":"<p>Cette référence à 10 chiffres se retrouve sur votre relevé de dépenses mensuelles.&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Vous avez besoin d’une carte de crédit pour votre entreprise ?","acceptedAnswer":{"text":"<p><span><span>Avec l’<strong>ING Mastercard Business</strong>, vous gardez un contrôle total sur vos dépenses professionnelles et profitez des avantages d'une carte spécialement conçue <strong>pour les entrepreneurs</strong>. Cette carte offre une vue d'ensemble de vos propres dépenses professionnelles ainsi que celles de vos employés. Vous gérez ainsi vos achats de manière efficace. Que vous effectuiez des achats professionnels fréquents, voyagiez souvent pour le travail, ou souhaitiez optimiser votre gestion de trésorerie, l’ING Mastercard Business est un outil indispensable pour toute entreprise. </span></span></p><p><span><span>Découvrez tous les avantages de l’ING Mastercard Business <strong><a href=\"carte-de-credit-professionnelle\">ici</a></strong>.</span></span></p>","@type":"Answer"},"@type":"Question"},{"name":"Est-ce qu’ ING propose une carte de crédit prépayée ?","acceptedAnswer":{"text":"<p><span><span><span><span><span>Non, ING ne propose pas de carte de crédit prépayée.</span></span></span></span></span></p><p><span><span><span><span><span>Si vous souhaitez effectuer des paiements en Belgique ou à l’étranger, vous pouvez utiliser nos cartes de débit ou de crédit classiques, qui offrent des solutions simples, sécurisées et adaptées à vos besoins.</span></span></span></span></span></p>","@type":"Answer"},"@type":"Question"}],"@context":"https://schema.org","@type":"FAQPage"}</script>
