<script type="application/ld+json">{"mainEntity":[{"name":"Is een jongerenrekening echt gratis?","acceptedAnswer":{"text":"<p>Ja. De ING Go to 18-rekening is gratis voor jongeren van 8 tot en met 17 jaar. Er is geen maandelijkse bijdrage voor de rekening of de bijhorende debetkaart.</p><p>Wil je meer informatie over deze jongerenrekening? Bekijk dan:</p><ul><li><a href=\"https://assets.ing.com/m/bcd3649b5a781ae3/original/pricing-list-private-New-NL.pdf\">De Tarieven van de meest voorkomende bankdiensten en -verrichtingen voor privégebruik&nbsp;(pdf)</a>&nbsp;</li></ul><ul><li><a href=\"https://assets.ing.com/m/60f1aea7c1fe493f/fee-information-document-ing-go-to-18-account-new-NL.pdf\">Het Informatiedocument betreffende de vergoedingen - ING Go to 18-rekening (pdf)</a></li></ul>","@type":"Answer"},"@type":"Question"},{"name":"Wie kan de ING Go to 18-rekening openen?","acceptedAnswer":{"text":"<p>De ING Go to 18-rekening is bedoeld voor kinderen en jongeren tussen 8 en 17 jaar. De aanvraag gebeurt door een ouder of wettelijke voogd.</p>","@type":"Answer"},"@type":"Question"},{"name":"Kan ik een ING Go to 18-rekening openen als ik geen ING-klant ben?","acceptedAnswer":{"text":"<p>Ja. Ook als je nog geen klant bent bij ING, kun je een ING Go to 18-rekening openen voor je kind.</p><p>Je kunt de aanvraag eenvoudig online starten via <a href=\"onboarding-non-ing-parent-go-to-18-open\">deze link</a>.</p>","@type":"Answer"},"@type":"Question"},{"name":"Kan ik een rekening openen voor een kind jonger dan 8 jaar?","acceptedAnswer":{"text":"<p>Nee. De ING Go to 18-rekening is beschikbaar voor kinderen vanaf 8 jaar. Wil je al vroeger beginnen sparen voor je kind? Dan kun je een ING-spaarrekening openen. Zo bouw je alvast een spaarpotje op voor later.</p><p>Raadpleeg alle informatie over deze spaarrekening via <a href=\"-banking-content-individuals-products-saving-savings-account-minors-product-page\">deze link.</a></p>","@type":"Answer"},"@type":"Question"},{"name":"Hoe open ik een ING Go to 18-zichtrekening?","acceptedAnswer":{"text":"<p>Ben je al ING-klant? Dan kun je eenvoudig een ING Go to 18-rekening openen via de ING Banking-app, via de Home'Bank of in een ING-kantoor. In de ING Banking-app onderneem je de volgende stappen:</p><p>1. Tik op \"Zichtrekeningen\" onder het tabblad \"Producten\",</p><p>2. Selecteer de optie \"ING Go to 18\",</p><p>3. Tik op \"Vraag een gratis jongerenrekening aan\".</p><p>&nbsp;</p><p>Ben je nog geen ING-klant? Dan kun je de rekening online aanvragen via <a href=\"onboarding-non-ing-parent-go-to-18-open\">deze link</a>. We begeleiden je stap voor stap.</p>","@type":"Answer"},"@type":"Question"},{"name":"Wie is houder van de ING Go to 18-rekening?","acceptedAnswer":{"text":"<p>De ING Go to 18-rekening staat uitsluitend op naam van het kind. Er kan slechts één rekeninghouder zijn en het is niet mogelijk om een volmacht toe te voegen aan deze jongerenrekening. Via het Kinderoverzicht behoudt de ouder wel volledig inzicht in de rekening.</p><p>&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Hoe krijg ik toegang tot de ING Go to 18-rekening van mijn kind?","acceptedAnswer":{"text":"<p>Via het Overzicht kinderen in de ING Banking-app volg je eenvoudig de rekening van je minderjarig kind op.</p><p>Vanuit het Overzicht kinderen kan je eenvoudig:</p><ul><li>De recente verrichtingen bekijken;</li><li>De debetkaart tijdelijk pauzeren of opnieuw activeren;</li><li>Kaart- en betaalinstellingen- beheren;</li><li>Rechtstreeks zakgeld overschrijven naar de rekening van&nbsp;je kind.</li></ul><p>Zo behoud je op een eenvoudige en veilige manier het overzicht.&nbsp;</p><p><a href=\"https://www.ing.be/nl/particulieren/kinderen/overzicht-kinderen\">Lees alles over de functie Kinderoverzicht.</a></p>","@type":"Answer"},"@type":"Question"},{"name":"Welke controle heb ik als ouder over de jongerenrekening?","acceptedAnswer":{"text":"<p>Met het Overzicht kinderen in de ING Banking-app behoud je inzicht in de rekening van je kind.</p><p>Je kunt onder andere:</p><ul><li>Recente verrichtingen opvolgen;</li><li>Kaartinstellingen beheren;</li><li>Bepaalde betaal- en opnamelimieten aanpassen;</li><li>De kaart tijdelijk blokkeren of opnieuw activeren.</li></ul><p>Zo help je je kind stap voor stap verantwoord omgaan met geld.</p>","@type":"Answer"},"@type":"Question"},{"name":"Krijgt mijn kind een betaalkaart bij de ING Go to 18-rekening?","acceptedAnswer":{"text":"<p>Ja. Bij de ING Go to 18-rekening hoort een debetkaart waarmee je kind veilig kan betalen in winkels, online aankopen kan doen en geld kan opnemen aan geldautomaten.</p><p>Contactloos betalen is eveneens mogelijk. Je kind kan de ING Banking-app gebruiken vanaf de leeftijd van 8 jaar.</p>","@type":"Answer"},"@type":"Question"},{"name":"Wat gebeurt er als de betaalkaart verloren of gestolen is?","acceptedAnswer":{"text":"<p>Raakt de debetkaart van je kind verloren of wordt ze gestolen? Dan kun je de kaart onmiddellijk blokkeren via de ING Banking-app.</p><p>Je kunt daarna eenvoudig een nieuwe kaart aanvragen. De eerste vervanging van een verloren of gestolen kaart is gratis.</p><p>Meer informatie vind je op onze hulp- en supportpagina over verlies of diefstal van een kaart.</p>","@type":"Answer"},"@type":"Question"},{"name":"Wat gebeurt er als mijn kind 18 wordt?","acceptedAnswer":{"text":"<p>Wanneer je kind 18 jaar wordt, wordt de ING Go to 18-rekening automatisch omgezet naar een ING Go pack.</p><p>Je kind behoudt zo zijn rekening en dagelijkse bankdiensten zonder onderbreking. Het ING Go pack is gratis voor jongeren tussen de 18 en 25 jaar. Hierdoor wordt het maandelijkse forfait van het ING Go pack pas aangerekend vanaf de leeftijd van 26 jaar.</p><p><strong>Vanaf 18 jaar beheert je kind de rekening volledig zelfstandig.</strong> De ouderlijke toegang en controle vervallen, tenzij er bijkomende stappen worden genomen. <strong>Lees meer informatie voor <a href=\"turning18_forparents\">ouders </a>en <a href=\"youth-turning-18\">kinderen</a>.</strong></p>","@type":"Answer"},"@type":"Question"}],"@context":"https://schema.org","@type":"FAQPage"}</script>
