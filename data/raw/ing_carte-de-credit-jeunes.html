<script type="application/ld+json">{"mainEntity":[{"name":"Quels frais puis-je être amenée à payer ?","acceptedAnswer":{"text":"<p>Tu payes une cotisation mensuelle fixe de 0,83 €/mois, sauf si tu es titulaire d'un pack ING More.</p><p>Tu as payé en euros et tu as suffisamment d’argent sur ton compte courant au moment de la clôture mensuelle ? Aucun frais supplémentaire ni intérêt ne s’applique.&nbsp;</p><p>🚫À savoir : des frais sont facturés si tu retires de l’argent avec ta carte de crédit à un distributeur automatique. C’est pourquoi nous te recommandons d’utiliser ta carte de débit ING pour ce type de retrait quand c’est possible, en Belgique comme à l’étranger.&nbsp;&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Une question liée aux dépenses de ta carte de crédit ?","acceptedAnswer":{"text":"<p>Les informations relatives aux transactions effectuées à l’aide de ta carte de crédit sont disponibles sur le site <a href=\"https://macarte.be/fr/home/help.html\">macarte.be</a>. &nbsp;<br />Tu y trouveras notamment</p><ul><li>comment demander une copie de ton état de dépenses&nbsp;</li><li>comment contester un achat via ce formulaire: <a href=\"https://macarte.be/fr-be/home/how-can-we-help/forms/purchase-dispute\">Contester un achat - Worldline Belgique</a></li><li>comment récupérer un solde positif qui a été crédité sur ta carte</li></ul>","@type":"Answer"},"@type":"Question"},{"name":"La carte de crédit est-elle incluse dans le pack ING More ?","acceptedAnswer":{"text":"<p>Oui, tu paux demander une carte de crédit Visa Classic incluse dans ton pack ING More (sous réserve d’acceptation). Aucun frais supplémentaire tant que tu conserves le pack.</p><p>Découvrez tous les avantages du pack ING More&nbsp;<a href=\"https://www.ing.be/fr/particuliers/comptes-bancaire-packs/pack-more\">ici</a></p>","@type":"Answer"},"@type":"Question"},{"name":"Quelle sécurité pour mes achats en ligne ?","acceptedAnswer":{"text":"<p>Grâce à Verified by Visa,&nbsp;<a href=\"payer-sur-internet\">tu payes en toute sécurité</a>&nbsp;avec ta carte de crédit auprès des magasins en ligne participants. Tes achats, effectués sur internet, sont en plus assurés contre la non-livraison et la livraison non conforme, et ce à concurrence de 500 euros au maximum par an. Tu bénéficies de plusieurs assurances comprises, dont une assurance \"<a href=\"carte-visa-classic-assurances\">livraison des biens achetés sur internet</a>\".&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Quelles assurances sont comprises ?","acceptedAnswer":{"text":"<p>En tant que titulaire d'une carte de crédit ING Visa Classic, tu profites de<a href=\"carte-visa-classic-assurances\"> 3 assurances gratuites</a> :</p><ul><li><strong>La garantie achat</strong>&nbsp;</li><li><strong>L'assurance \"Livraison des biens achetés sur internet\"</strong>&nbsp;</li><li><strong>L'assurance accident de voyage</strong>&nbsp;</li></ul><p>Retrouve&nbsp;<a href=\"carte-visa-classic-assurances_1\">ici</a>&nbsp;le&nbsp;détail des couvertures ainsi que la procédure à suivre pour introduire une déclaration de sinistre.</p><p>Pour toutes informations complémentaires sur ces assurances, veuillez lire&nbsp;<a href=\"https://assets.ing.com/m/607dd086c6d50800/original/ReglementINGVisaClassicVisaGoldMCGoldNewFR.pdf\">les conditions générales (PDF)</a>.</p>","@type":"Answer"},"@type":"Question"},{"name":"Comment activer ma carte de crédit une fois reçue ?","acceptedAnswer":{"text":"<p>Tu trouveras les étapes à suivre dans&nbsp;<a href=\"ma-nouvelle-carte\">cet article</a>.</p>","@type":"Answer"},"@type":"Question"},{"name":"Que faire pour utiliser ma carte de crédit à l'étranger ?","acceptedAnswer":{"text":"<p>Chez ING, ta carte de crédit est automatiquement activée pour une utilisation à l’étranger, contrairement à certaines banques. Tu n’as donc à t'occuper de rien ! Ta carte de crédit n’est restreinte à aucune région. Tu peux donc effectuer des paiements et des retraits d'espèces depuis n’importe quel pays, en toute liberté et toute sécurité.</p>","@type":"Answer"},"@type":"Question"},{"name":"Puis-je l'utiliser pour effectuer des retraits en espèces ?","acceptedAnswer":{"text":"<p>Bien sûr ! C’est possible dans tous les distributeurs et dans les agences bancaires affichant le logo Visa, en Belgique et à l’étranger ! Découvre&nbsp;<a href=\"trouver-un-distributeur\">où tu peux retirer de l'argent</a> avec ta carte de débit ou ta carte de crédit.&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Comment s'effectue le remboursement de tes dépenses ?","acceptedAnswer":{"text":"<p>Le remboursement de tes dépenses mensuelles se fait automatiquement avec ta carte de crédit ING Visa Classic. La clôture des dépenses est fixée au 27 de chaque mois et le&nbsp;<a href=\"comparatif-compte-bancaire\">compte à vue ING lié</a>&nbsp;à ta carte Visa est débité 9 jours de calendrier plus tard. Tu ne dois donc te soucier de rien !</p>","@type":"Answer"},"@type":"Question"},{"name":"Comment garder un oeil sur mes dépenses ?","acceptedAnswer":{"text":"<p>Vérifiez vos dépenses quand vous voulez : vous pouvez vérifier vos dépenses, du mois en cours et du mois précédent, via nos applications sécurisées pour&nbsp;<a href=\"app-banque-ing-banking-facile\">smartphone</a>&nbsp;ou&nbsp;<a href=\"pc-banking\">Home'Bank</a>. Vous accédez facilement à un aperçu détaillé de vos dépenses et du montant disponible. Vous êtes donc toujours parfaitement informé du montant disponible pour régler vos achats avec votre carte de crédit ING Visa Classic.</p>","@type":"Answer"},"@type":"Question"},{"name":"Où retrouver les relevés de dépenses d’une carte de crédit ?","acceptedAnswer":{"text":"<p>Les relevés mensuels de dépenses des cartes de crédit ING sont disponibles gratuitement</p><ul><li><strong>en ligne, via Zoomit </strong></li><li><strong>ou en format papier</strong>, envoyés par la Poste<strong> </strong></li></ul><p>Si vous recevez vos <strong>extraits de compte</strong> de manière électronique, les relevés de dépenses de votre carte de crédit sont également disponibles <strong>en ligne, via Zoomit</strong>. L’enregistrement en Zoomit est automatique&nbsp;; vous ne devez rien faire&nbsp;!</p><p>Découvrez <a href=\"releves-de-depenses-en-ligne\">en détail</a> comment ça marche.</p><p>Si vous recevez <strong>vos relevés de dépenses carte de crédit en format papier</strong>, vous pouvez gérer le mode d’envoi dans l’app ING Banking et Home’Bank, et opter pour la version électronique.&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Combien de temps ma carte de crédit est-elle valable ?","acceptedAnswer":{"text":"<p><span><span><span><span><span>La validité de votre </span></span></span><span><span><span>carte de credit</span></span></span><span><span><span> est de 5 ans. Elle est automatiquement renouvelée et une nouvelle carte vous est envoyée 2 mois avant la date d’échéance.</span></span></span></span></span></p>","@type":"Answer"},"@type":"Question"},{"name":"Carte de crédit perdue ou volée ?","acceptedAnswer":{"text":"<p>Vérifiez&nbsp;<a href=\"https://www.ing.be/fr/particuliers/gerer-le-quotidien/bloquer-carte-perdue-ou-volee\">comment bloquer votre carte en ligne immédiatement</a>.</p>","@type":"Answer"},"@type":"Question"}],"@context":"https://schema.org","@type":"FAQPage"}</script>
