<script type="application/ld+json">{"mainEntity":[{"name":"What is a savings account?","acceptedAnswer":{"text":"<p>A savings account is a deposit account which allows you to store your money safely and earn interest. You can withdraw the funds whenever you need them.</p>","@type":"Answer"},"@type":"Question"},{"name":"When will my child receive interest on his/her savings account?","acceptedAnswer":{"text":"<p>The&nbsp;<strong>base rate interest</strong>&nbsp;starts to accrue on the day after the money is paid into the account and continues up to the day it is withdrawn. It is paid into your account on a yearly basis, on the 1st of January, or when you close your account.</p><p>The&nbsp;<strong>fidelity premium</strong>&nbsp;is only earned on amounts that have remained uninterruptedly in the regulated savings account for 12 months from the day following the deposit. The premium is paid into the account on the first day after each quarter&nbsp;(January, April, July, October)</p>","@type":"Answer"},"@type":"Question"},{"name":"How and why do I save for my child?","acceptedAnswer":{"text":"<p>Want some more tips and tricks on exactly how to get started? We would be happy to help you. Feel free to read a bit more about&nbsp;<a href=\"https://www.ing.be/en/individuals/saving/child-savings-accounts\">why and how to save for your child</a>.</p>","@type":"Answer"},"@type":"Question"},{"name":"How many people can be linked to the Youth savings account?","acceptedAnswer":{"text":"<p>Only the legal representatives of the minor can be intermediaries in the Youth savings account.</p>","@type":"Answer"},"@type":"Question"},{"name":"How do I open a savings account for young people/babies via the ING Banking app ?","acceptedAnswer":{"text":"<ol><li>Tap ‘Saving and term accounts’ on the ‘Products’ tab.</li><li>Select the option ‘The savings account for minors’</li><li>Tap ‘Open this account’ at the bottom of the page.</li></ol>","@type":"Answer"},"@type":"Question"},{"name":"Can my child withdraw money without my permission ?","acceptedAnswer":{"text":"<p>Not by default. When you open the savings account for your child, you can activate this option (Sterkmaking / Porte-Fort) so that a child older than 10 can indeed take money out of the account. <a href=\"https://www.ing.be/en/individuals/saving/authorization-on-savings-account\">Read more about Authorization here</a>.</p>","@type":"Answer"},"@type":"Question"},{"name":"Do I need an ING Current Account to open an ING Savings Account for my child?","acceptedAnswer":{"text":"<p><span><span><span><span lang=\"EN-GB\" dir=\"ltr\"><span>If you are not yet an ING customer, you can open an ING Savings Account for your child, either digitally or in-branch. You only need to be registered with ING to be able to open and manage your child’s account. If you already have an ING account (Current Account, Savings Account or Investment Account), you can open the account either digitally or in-branch.</span></span></span></span></span></p>","@type":"Answer"},"@type":"Question"},{"name":"Where can you transfer money to from an ING Savings Account in the name of a minor?","acceptedAnswer":{"text":"<p><span><span><span><span lang=\"EN-GB\" dir=\"ltr\"><span>You can transfer money from your child’s ING savings account to:</span></span></span></span></span></p><ul><li><span><span><span><span lang=\"EN-GB\" dir=\"ltr\"><span>A current account with ING in your child’s name</span></span></span></span></span></li><li><span><span><span><span lang=\"EN-GB\" dir=\"ltr\"><span>A regulated savings account with ING in your child’s name where you are named as legal representative</span></span></span></span></span></li><li><span><span><span><span lang=\"EN-GB\" dir=\"ltr\"><span>An account with another Belgian bank in your child’s name, referred to as an <span>external reference account</span> </span></span></span></span></span><br /><span><span><span><span lang=\"EN-GB\" dir=\"ltr\"><span>(this is only possible if your child does not have a current account with ING)</span></span></span></span></span></li><li><span><span><span><span lang=\"EN-GB\" dir=\"ltr\"><span>You can also make a cash withdrawal at a counter in any ING branch</span></span></span></span></span></li></ul><p><span><span><span><span lang=\"EN-GB\" dir=\"ltr\"><span>Please note: the money in the account of a minor must be managed by the legal representative as a <strong>prudent and reasonable person.</strong></span></span></span></span></span></p>","@type":"Answer"},"@type":"Question"}],"@context":"https://schema.org","@type":"FAQPage"}</script>
