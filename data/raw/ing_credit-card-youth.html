<script type="application/ld+json">{"mainEntity":[{"name":"What fees might I have to pay?","acceptedAnswer":{"text":"<p>You pay a €0,83 fixed monthly fee, unless you hold an ING More pack.</p><p>If you paid in euros and there is enough money in your current account at the time of the monthly closing, no additional fees or interest will apply.&nbsp;</p><p>🚫 Important to know: fees are charged if you withdraw cash from an ATM using your credit card. That’s why we recommend using your ING debit card for this type of withdrawal whenever possible, both in Belgium and abroad.&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Is my credit card included in the ING More pack?","acceptedAnswer":{"text":"<p>Yes, you can request a Visa Classic credit card for your ING More pack (subject to approval). No additional fee applies as long as you keep the pack.</p><p>Discovers all the ING More pack benefits&nbsp;<a href=\"http:\">here</a></p>","@type":"Answer"},"@type":"Question"},{"name":"How secure are my online purchases?","acceptedAnswer":{"text":"<p>Thanks to Verified by Visa,&nbsp;<a href=\"online-payments\">you can use your credit card with total peace of mind</a>&nbsp;at all participating web shops. Your internet purchases are also insured against non-delivery or faulty delivery up to 500 euros per claim and 1,000 euros per year.</p>","@type":"Answer"},"@type":"Question"},{"name":"What types of insurance are included?","acceptedAnswer":{"text":"<p>Your ING Visa Classic credit card comes with 3 different types of insurance cover at no extra charge.</p><ul><li><strong>The buyer's guarantee</strong></li><li><strong>Internet purchase delivery cover</strong></li><li><strong>Travel accident insurance</strong></li></ul><p>Discover&nbsp;<a href=\"https://www.ing.be/en/individuals/daily-banking/visa-classic-insurances\">here</a>&nbsp;the insurance offer and how to submit a claim file.</p><p>For all other information about this insurance, please refer to the&nbsp;<a href=\"https://assets.ing.com/m/4d0d671a5b5aeb15/original/ReglementINGVisaClassicVisaGoldMCGoldNewEN.pdf\">general terms and conditions (PDF)</a>.</p><p>.</p>","@type":"Answer"},"@type":"Question"},{"name":"How do I activate my credit card once I receive it?","acceptedAnswer":{"text":"<p>Simply follow&nbsp;<a href=\"my-new-card\">these simple steps</a>.</p>","@type":"Answer"},"@type":"Question"},{"name":"What do I need to do to use my credit card abroad?","acceptedAnswer":{"text":"<p>Unlike some banks, your ING Visa Classic credit card is automatically activated for international use. No special action is required on your part. You have the freedom to make payments and withdraw cash in any country, completely securely.</p>","@type":"Answer"},"@type":"Question"},{"name":"Can I use the card to make cash withdrawals","acceptedAnswer":{"text":"<p>Of course! You can use <a href=\"find-an-atm\">any ATM</a> or bank terminal displaying the Visa logo, both in Belgium and abroad.</p>","@type":"Answer"},"@type":"Question"},{"name":"How do I pay for my purchases?","acceptedAnswer":{"text":"<p>Hassle-free repayments: with your ING Visa Classic credit card, your monthly expenditure is repaid automatically. Each period is closed on the 27th of the month. The total amount owing for this period is then automatically debited from the&nbsp;<a href=\"compare-bank-accounts\">ING Current Account</a>&nbsp;linked to your ING Visa Classic credit card 9 calendar days later.</p>","@type":"Answer"},"@type":"Question"},{"name":"How can I keep track of my expenses?","acceptedAnswer":{"text":"<p>Check how much you’ve spent during the current and previous month via our&nbsp;<a href=\"ing-banking-app\">secure smartphone app</a>&nbsp;or&nbsp;<a href=\"pc-banking\">Home’Bank</a>. You’ll get a detailed picture of your spending and how much you can still pay with your ING Visa Classic credit card.</p>","@type":"Answer"},"@type":"Question"},{"name":"A question related to your credit card spending?","acceptedAnswer":{"text":"<p>Information relating to transactions carried out using your credit card is available on <a href=\"https://macarte.be/fr/home/help.html\">macarte.be (FR)</a>.<br />You will find in particular</p><ul><li>how to request a copy of your statement&nbsp;</li><li>how to dispute a purchase via this form: <a href=\"https://mijnkaart.be/nl-be/home/how-can-we-help/forms/purchase-dispute\">Dispute a purchase - Worldline Belgium</a></li><li>how to recover a positive balance that has been credited to your card</li></ul>","@type":"Answer"},"@type":"Question"},{"name":"Where can I find credit card expenditure statements?","acceptedAnswer":{"text":"<p>ING credit card monthly statements are available free of charge</p><ul><li><strong>online, via Zoomit</strong></li><li><strong>or in paper format</strong>, sent by post</li></ul><p>If you receive your <strong>account statements</strong> electronically, your credit card expenditure statements <strong>are also available</strong> <strong>online, via Zoomit</strong>. Registration in Zoomit is automatic; you don't have to do anything!</p><p>Find out <a href=\"online-expenditure-statements\">in detail</a>&nbsp;how it works.</p><p>If you receive your <strong>credit card</strong> <strong>expenditure statements in paper format</strong>, you can manage the delivery method in the ING Banking app and Home’Bank, and opt for the electronic version.</p>","@type":"Answer"},"@type":"Question"},{"name":"How long is my credit card valid?","acceptedAnswer":{"text":"<p><span><span><span>The validity of your credit card is 5 years. It is automatically renewed and a new card is sent 2 months before the expiry date.</span></span></span></p>","@type":"Answer"},"@type":"Question"},{"name":"Card lost or stolen?","acceptedAnswer":{"text":"<p>Check&nbsp;<a href=\"https://www.ing.be/en/individuals/daily-banking/block-lost-stolen-card\">how to block immediately you card online</a></p>","@type":"Answer"},"@type":"Question"}],"@context":"https://schema.org","@type":"FAQPage"}</script>
